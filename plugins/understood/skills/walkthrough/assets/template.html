<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #1a1a1a;
		--muted: #6b7280;
		--line: #e5e7eb;
		--accent: #0439d7;
		--code-bg: #f6f7f9;
		--say-bg: #f0f4ff;
		--panel: #ffffff;
		--shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .07);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #14161a;
			--fg: #e8e8ea;
			--muted: #9aa0aa;
			--line: #2a2e35;
			--accent: #7aa2ff;
			--code-bg: #1c1f25;
			--say-bg: #1a2030;
			--panel: #1a1d23;
			--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 2.5rem 1.25rem 6rem;
		background: var(--bg);
		color: var(--fg);
		font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
	}
	/* Floating sidebar: detached from the edge, rounded, its own surface. */
	#toc {
		position: fixed;
		top: 1.5rem;
		left: 1.5rem;
		width: 244px;
		max-height: calc(100vh - 3rem);
		overflow-y: auto;
		overscroll-behavior: contain;
		padding: 1.1rem .8rem 1.3rem;
		border: 1px solid var(--line);
		border-radius: 14px;
		background: var(--panel);
		box-shadow: var(--shadow);
		font-size: .82rem;
		line-height: 1.45;
		scrollbar-width: thin;
	}
	#toc::-webkit-scrollbar { width: 6px; }
	#toc::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
	.toc-title { font-weight: 700; letter-spacing: .06em; margin: 0 0 .8rem .35rem; font-size: .72rem; text-transform: uppercase; color: var(--muted); }
	#toc ol { list-style: none; margin: 0; padding: 0; }
	#toc ol.sub { margin: .2rem 0 .8rem .45rem; padding-left: .6rem; border-left: 1px solid var(--line); }
	#toc a { display: block; padding: .2rem .45rem; border-radius: 7px; color: var(--muted); text-decoration: none; transition: background .12s, color .12s; }
	#toc a:hover { background: var(--code-bg); color: var(--fg); }
	#toc a.sec { color: var(--fg); font-weight: 600; margin-top: .45rem; }
	#toc ol.sub a { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .735rem; }
	#toc a.active { color: var(--accent); background: var(--say-bg); font-weight: 600; }

	/* Content stays centred in the space left of the sidebar, not shoved right. */
	main { max-width: 780px; margin: 0 auto; padding-left: 276px; }
	@supports (width: min(1px, 1px)) {
		main { padding-left: 0; width: min(780px, 100%); margin-left: max(276px, calc(50vw - 390px)); margin-right: auto; }
	}
	:target { scroll-margin-top: 1.75rem; }
	@media (max-width: 1080px) {
		#toc { display: none; }
		main { margin: 0 auto; padding-left: 0; width: min(780px, 100%); }
	}
	h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
	.sub { color: var(--muted); margin: 0 0 2.5rem; font-size: .95rem; }
	h2 {
		font-size: 1.15rem;
		margin: 3rem 0 .35rem;
		padding-bottom: .5rem;
		border-bottom: 2px solid var(--line);
	}
	h2 .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
	h3 { font-size: .95rem; margin: 2rem 0 .5rem; color: var(--muted); font-weight: 600; }
	code, .path {
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: .875em;
	}
	a.path { text-decoration: none; }
	a.path:hover { border-color: var(--accent); }
	.path {
		display: inline-block;
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 4px;
		padding: .1rem .4rem;
		color: var(--accent);
	}
	pre {
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 6px;
		padding: .75rem 1rem;
		overflow-x: auto;
		margin: .6rem 0;
	}
	pre code { font-size: .82rem; line-height: 1.5; }
	ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
	ol.steps > li {
		counter-increment: s;
		position: relative;
		padding: 0 0 1.4rem 2.25rem;
		border-left: 2px solid var(--line);
		margin-left: .6rem;
	}
	ol.steps > li:last-child { border-left-color: transparent; }
	ol.steps > li::before {
		content: counter(s);
		position: absolute;
		left: -0.85rem;
		top: 0;
		width: 1.65rem;
		height: 1.65rem;
		border-radius: 50%;
		background: var(--accent);
		color: #fff;
		font-size: .8rem;
		font-weight: 600;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.action { font-weight: 600; }
	.say {
		background: var(--say-bg);
		border-left: 3px solid var(--accent);
		padding: .55rem .85rem;
		margin: .5rem 0 0;
		border-radius: 0 4px 4px 0;
		font-size: .93rem;
	}
	.say::before {
		content: "KEYWORD";
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		color: var(--accent);
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.ask {
		border-left: 3px solid var(--muted);
		padding: .5rem .85rem;
		margin: .5rem 0 0;
		font-size: .9rem;
		color: var(--muted);
	}
	.ask::before {
		content: "KNOW MORE";
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.ask b { color: var(--fg); font-weight: 600; }
	.say ul, .ask ul { margin: .1rem 0 0; padding-left: 1.05rem; }
	.say li, .ask li { margin: .12rem 0; }
	.note {
		border: 1px dashed var(--line);
		border-radius: 6px;
		padding: .85rem 1rem;
		margin: 1.25rem 0;
		font-size: .92rem;
		color: var(--muted);
	}
	.note strong { color: var(--fg); }
	table { border-collapse: collapse; width: 100%; margin: .5rem 0 0; font-size: .92rem; }
	th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
	th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
	ul.plain { padding-left: 1.1rem; margin: .4rem 0; }
	ul.plain li { margin-bottom: .3rem; }
	/* Data-first components: pipeline block, IN/OUT boundary, stage tag, BEFORE/AFTER pair. */
	.pipe { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); padding: 1.1rem 1.25rem; margin: 1.25rem 0 0; }
	.pipe .pt { font-size: .68rem; letter-spacing: .09em; font-weight: 700; color: var(--accent); text-transform: uppercase; margin: 0 0 .6rem; }
	.pipe ol { list-style: none; margin: 0; padding: 0; }
	.pipe li { position: relative; padding: .28rem 0 .28rem 1.4rem; font-size: .92rem; }
	.pipe li::before { content: "\2192"; position: absolute; left: .15rem; color: var(--accent); font-weight: 600; }
	.pipe li:first-child::before { content: "\25CF"; font-size: .7rem; top: .48rem; }
	.pipe li .where { float: right; color: var(--muted); font-size: .72rem; font-family: ui-monospace, Menlo, monospace; padding-top: .15rem; }
	.pipe .foot { margin: .7rem 0 0; color: var(--muted); font-size: .8rem; }
	.rec { display: block; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: .45rem .6rem; margin: .4rem 0 0; font-size: .78rem; overflow-x: auto; white-space: nowrap; }
	.tag { float: right; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: var(--accent); background: var(--say-bg); border-radius: 999px; padding: .1rem .55rem; margin-left: .5rem; }
	h2 .tag { float: none; vertical-align: .15rem; }
	.io { margin: .55rem 0 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
	.io div { display: flex; gap: .6rem; padding: .4rem .6rem; font-size: .87rem; align-items: baseline; }
	.io div + div { border-top: 1px solid var(--line); }
	.io b { flex: 0 0 2.2rem; font-size: .66rem; letter-spacing: .08em; color: var(--accent); }
	.io span { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; overflow-wrap: anywhere; }
	.ba { margin: .55rem 0 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
	.ba div { display: flex; gap: .6rem; padding: .45rem .6rem; font-size: .88rem; align-items: baseline; }
	.ba b { flex: 0 0 3.6rem; font-size: .66rem; letter-spacing: .08em; }
	.ba .b { background: rgba(220, 60, 60, .07); }
	.ba .b b { color: #c0392b; }
	.ba .a { background: rgba(40, 160, 90, .08); border-top: 1px solid var(--line); }
	.ba .a b { color: #1f9d55; }
	@media (prefers-color-scheme: dark) {
		.ba .b { background: rgba(220, 60, 60, .12); }
		.ba .a { background: rgba(40, 160, 90, .12); }
		.ba .b b { color: #e07b6d; }
		.ba .a b { color: #5fc98e; }
	}
	/* Ask-from-selection: floating chip, question input, pinned Q&A card. */
	#askchip, #askpop { position: absolute; z-index: 60; }
	#askchip {
		display: none;
		padding: .3rem .75rem;
		border: 0;
		border-radius: 999px;
		background: var(--accent);
		color: #fff;
		font-size: .78rem;
		font-weight: 600;
		cursor: pointer;
		box-shadow: var(--shadow);
	}
	#askpop {
		display: none;
		width: min(420px, 90vw);
		padding: .4rem;
		border: 1px solid var(--line);
		border-radius: 10px;
		background: var(--panel);
		box-shadow: var(--shadow);
	}
	#askpop input {
		width: 100%;
		border: 0;
		outline: none;
		background: transparent;
		color: var(--fg);
		font: inherit;
		font-size: .9rem;
		padding: .25rem .35rem;
	}
	#askmenu {
		display: none;
		margin-top: .25rem;
		border-top: 1px solid var(--line);
		padding-top: .25rem;
		max-height: 220px;
		overflow-y: auto;
	}
	#askmenu .mi {
		display: flex;
		gap: .6rem;
		align-items: baseline;
		padding: .3rem .45rem;
		border-radius: 7px;
		cursor: pointer;
	}
	#askmenu .mi code { color: var(--accent); font-size: .8rem; white-space: nowrap; }
	#askmenu .mi span {
		color: var(--muted);
		font-size: .78rem;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	#askmenu .mi.on, #askmenu .mi:hover { background: var(--say-bg); }
	.qa {
		position: relative;
		border: 1px solid var(--line);
		border-radius: 8px;
		background: var(--panel);
		padding: .55rem .85rem .6rem;
		margin: .6rem 0 0;
		font-size: .9rem;
		transition: border-color .25s, box-shadow .25s;
	}
	.qa.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--say-bg); }
	.qa-replybox { margin: .55rem 0 0; padding-top: .5rem; border-top: 1px solid var(--line); }
	.qa-replybox input {
		width: 100%;
		border: 0;
		outline: none;
		background: transparent;
		color: var(--fg);
		font: inherit;
		font-size: .85em;
		padding: .1rem 0;
	}
	.qa-replybox input::placeholder { color: var(--muted); }
	.qa-quote {
		display: flex;
		gap: .4rem;
		align-items: center;
		border-left: 2px solid var(--accent);
		background: var(--say-bg);
		border-radius: 4px;
		padding: .2rem .45rem;
		margin-bottom: .35rem;
		font-size: .78em;
		color: var(--muted);
	}
	.qa-quote span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.qa-quote button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1em; padding: 0 .1rem; }
	.qa.reply .qa-sel { font-size: .8em; margin: 0 0 .2rem; }
	.qa-flow { display: flex; flex-wrap: wrap; gap: .3rem .4rem; align-items: center; margin: .3rem 0 0; }
	.qa-flow .step {
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 6px;
		padding: .1rem .45rem;
		font-size: .82em;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	}
	.qa-flow .arw { color: var(--accent); font-weight: 600; }
	.qa-svg { margin: .35rem 0 0; }
	.qa-svg svg { max-width: 100%; height: auto; display: block; }
	.hl.asked { transition: background .15s; }
	.hl.asked.lit { background: rgba(255, 200, 40, .55); }
	@media (prefers-color-scheme: dark) { .hl.asked.lit { background: rgba(255, 213, 79, .4); } }
	#chatbox {
		position: fixed;
		right: 1.25rem;
		bottom: 1.25rem;
		width: min(340px, calc(100vw - 2.5rem));
		background: var(--panel);
		border: 1px solid var(--line);
		border-radius: 12px;
		box-shadow: var(--shadow);
		padding: .5rem .6rem;
		z-index: 55;
	}
	#chatbox > input {
		width: 100%;
		border: 0;
		outline: none;
		background: transparent;
		color: var(--fg);
		font: inherit;
		font-size: .88rem;
		padding: .1rem .1rem;
	}
	#chatbox > input::placeholder { color: var(--muted); }
	#chatlog { display: flex; flex-direction: column; gap: .5rem; max-height: 45vh; overflow-y: auto; margin-bottom: .45rem; }
	#chatlog:empty { display: none; margin: 0; }
	#chatlog .qa { margin: 0; font-size: .84rem; }
	/* Corner hook pointing at the corner that faces the asked text. */
	.qa::after { content: ""; position: absolute; width: 18px; height: 18px; display: none; pointer-events: none; }
	.qa.dir-tr::after { display: block; top: -2px; right: -2px; border-top: 3px solid var(--accent); border-right: 3px solid var(--accent); border-top-right-radius: 10px; }
	.qa.dir-tl::after { display: block; top: -2px; left: -2px; border-top: 3px solid var(--accent); border-left: 3px solid var(--accent); border-top-left-radius: 10px; }
	.qa.dir-br::after { display: block; bottom: -2px; right: -2px; border-bottom: 3px solid var(--accent); border-right: 3px solid var(--accent); border-bottom-right-radius: 10px; }
	.qa.dir-bl::after { display: block; bottom: -2px; left: -2px; border-bottom: 3px solid var(--accent); border-left: 3px solid var(--accent); border-bottom-left-radius: 10px; }
	.qa::before {
		content: "ASKED";
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		color: var(--accent);
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.qa-sel {
		color: var(--muted);
		border-left: 2px solid var(--line);
		padding-left: .5rem;
		margin: 0 0 .25rem;
		font-size: .82rem;
		overflow-wrap: anywhere;
	}
	.qa-q { font-weight: 600; margin: 0; }
	.qa-a { margin: .3rem 0 0; overflow-wrap: anywhere; }
	.qa-a code { overflow-wrap: anywhere; }
	.qa a { color: var(--accent); text-decoration: none; }
	.qa a:hover { text-decoration: underline; text-underline-offset: 2px; }
	.qa-a p { margin: .15rem 0 0; }
	.qa-a ul { margin: .1rem 0 0; padding-left: 1.05rem; }
	.qa-a li { margin: .12rem 0; }
	.qa-status { color: var(--muted); font-size: .78rem; margin: .3rem 0 0; }
	#qa-rail .qa { margin: 0; font-size: .84rem; box-shadow: var(--shadow); border-radius: 8px; }
	.qa.reply, #qa-rail .qa.reply {
		position: static;
		margin: .6rem 0 0;
		padding: .55rem 0 0;
		border: 0;
		border-top: 1px solid var(--line);
		border-radius: 0;
		background: transparent;
		box-shadow: none;
		font-size: 1em;
	}
	.qa.reply::before, .qa.reply::after { content: none; }
	.qa.reply .qa-q::before { content: "\21B3\00a0"; color: var(--accent); font-weight: 700; }
	#hl-layer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
	#hl-layer .hl { position: absolute; border-radius: 2px; }
	#hl-layer .hl.asking { background: rgba(84, 143, 255, .30); }
	#hl-layer .hl.asked { background: rgba(255, 200, 40, .35); }
	@media (prefers-color-scheme: dark) {
		#hl-layer .hl.asking { background: rgba(122, 162, 255, .32); }
		#hl-layer .hl.asked { background: rgba(255, 213, 79, .22); }
	}
</style>
</head>
<body>
{{NAV}}
<main>

<h1>{{TITLE}}</h1>
<p class="sub">{{SUBTITLE}}</p>

{{BODY}}

</main>
<script id="skills-data" type="application/json">{{SKILLS}}</script>
<script>
	const links = [...document.querySelectorAll('#toc a')];
	const targets = links.map(a => document.getElementById(a.hash.slice(1))).filter(Boolean);
	const spy = new IntersectionObserver(entries => {
		entries.forEach(e => {
			if (!e.isIntersecting) return;
			links.forEach(a => a.classList.toggle('active', a.hash === '#' + e.target.id));
		});
	}, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
	targets.forEach(t => spy.observe(t));

	// Ask-from-selection: POST to serve.py, poll /qa.json, pin cards under stops.
	const mainEl = document.querySelector('main');
	const chip = document.createElement('button');
	chip.id = 'askchip';
	chip.type = 'button';
	chip.textContent = 'Ask';
	const pop = document.createElement('div');
	pop.id = 'askpop';
	const askInput = document.createElement('input');
	askInput.placeholder = 'ask about this selection… ("/" for skills)';
	const menu = document.createElement('div');
	menu.id = 'askmenu';
	pop.append(askInput, menu);
	document.body.append(chip, pop);

	let skills = [];
	try { skills = JSON.parse(document.getElementById('skills-data').textContent); } catch (e) {}
	if (!Array.isArray(skills)) skills = [];
	let menuHits = [];
	let menuIdx = 0;

	function closeMenu() { menu.style.display = 'none'; menuHits = []; }
	function updateMenu() {
		const m = askInput.value.match(/^\/(\S*)$/);
		if (!m || !skills.length) { closeMenu(); return; }
		const tok = m[1].toLowerCase();
		menuHits = skills
			.filter(s => s.name.toLowerCase().includes(tok))
			.sort((a, b) => (b.name.toLowerCase().startsWith(tok)) - (a.name.toLowerCase().startsWith(tok)) || a.name.localeCompare(b.name))
			.slice(0, 8);
		if (!menuHits.length) { closeMenu(); return; }
		menuIdx = Math.min(menuIdx, menuHits.length - 1);
		menu.replaceChildren(...menuHits.map((s, i) => {
			const item = document.createElement('div');
			item.className = 'mi' + (i === menuIdx ? ' on' : '');
			const name = document.createElement('code');
			name.textContent = '/' + s.name;
			const hint = document.createElement('span');
			hint.textContent = s.hint || '';
			item.append(name, hint);
			item.addEventListener('pointerdown', e => { e.preventDefault(); menuIdx = i; pickSkill(); });
			return item;
		}));
		menu.style.display = 'block';
		const on = menu.children[menuIdx];
		if (on) on.scrollIntoView({ block: 'nearest' });
	}
	function pickSkill() {
		const hit = menuHits[menuIdx];
		if (!hit) return;
		askInput.value = '/' + hit.name + ' ';
		closeMenu();
		askInput.focus();
	}
	askInput.addEventListener('input', () => { menuIdx = 0; updateMenu(); });

	let sel = null;
	const pendingSince = {};
	let pollTimer = null;

	// Keep the selection painted while the input has focus, flip it yellow once sent.
	// Overlay rectangles merged per line, so the band is continuous like a native
	// selection even across code spans with different font metrics.
	const hlLayer = document.createElement('div');
	hlLayer.id = 'hl-layer';
	const rail = document.createElement('div');
	rail.id = 'qa-rail';
	const chatbox = document.createElement('div');
	chatbox.id = 'chatbox';
	const chatlog = document.createElement('div');
	chatlog.id = 'chatlog';
	const chatInput = document.createElement('input');
	chatInput.placeholder = 'ask anything about this page…';
	chatbox.append(chatlog, chatInput);
	document.body.append(hlLayer, rail, chatbox);
	chatInput.addEventListener('keydown', e => {
		if (e.key !== 'Enter') return;
		const question = chatInput.value.trim();
		if (!question) return;
		chatInput.value = '';
		submitQuestion({ id: newId(), stop: '', selection: '', question, parent: '' });
	});
	let savedRange = null;
	let askingRange = null;
	const askedRanges = new Map();

	function lineBands(range) {
		const lines = [];
		for (const r of range.getClientRects()) {
			if (r.width <= 0 || r.height <= 0) continue;
			const line = lines.find(l =>
				Math.min(l.bottom, r.bottom) - Math.max(l.top, r.top) > Math.min(l.bottom - l.top, r.height) * .5);
			if (!line) { lines.push({ top: r.top, bottom: r.bottom, left: r.left, right: r.right }); continue; }
			line.top = Math.min(line.top, r.top);
			line.bottom = Math.max(line.bottom, r.bottom);
			line.left = Math.min(line.left, r.left);
			line.right = Math.max(line.right, r.right);
		}
		return lines;
	}
	function paintHl() {
		hlLayer.replaceChildren();
		const draw = (range, cls, qid) => {
			for (const line of lineBands(range)) {
				const d = document.createElement('div');
				d.className = 'hl ' + cls;
				if (qid) d.dataset.qid = qid;
				d.style.left = line.left + scrollX + 'px';
				d.style.top = line.top + scrollY + 'px';
				d.style.width = (line.right - line.left) + 'px';
				d.style.height = (line.bottom - line.top) + 'px';
				hlLayer.append(d);
			}
		};
		askedRanges.forEach((r, id) => draw(r, 'asked', id));
		if (askingRange) draw(askingRange, 'asking');
	}
	// Click a yellow mark, its card scrolls in and flashes. Hit-tested from the
	// document so the overlay never steals text selection.
	function focusCard(id) {
		const card = document.getElementById('qa-' + id);
		if (!card) return;
		const r = card.getBoundingClientRect();
		if (r.top < 0 || r.bottom > innerHeight) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
		card.classList.add('focus');
		setTimeout(() => card.classList.remove('focus'), 1600);
	}
	document.addEventListener('click', e => {
		const s = getSelection();
		if (s && !s.isCollapsed) return;
		if (e.target.closest('.qa, #askchip, #askpop, a')) return;
		for (const d of hlLayer.querySelectorAll('.hl.asked')) {
			const r = d.getBoundingClientRect();
			if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
				focusCard(d.dataset.qid);
				return;
			}
		}
	});
	// Cards float beside their highlight, Docs-comment style, on whichever
	// margin has room, left, right, or both; in-flow when neither does.
	function sideRooms() {
		const m = mainEl.getBoundingClientRect();
		const toc = document.getElementById('toc');
		const tocEdge = toc && getComputedStyle(toc).display !== 'none' ? toc.getBoundingClientRect().right : 0;
		const leftRoom = m.left - tocEdge - 44;
		const rightRoom = innerWidth - m.right - 40;
		return {
			left: leftRoom >= 240
				? { x: m.left - 24 - Math.min(320, leftRoom), width: Math.min(320, leftRoom) } : null,
			right: rightRoom >= 240
				? { x: m.right + 24, width: Math.min(320, rightRoom) } : null,
		};
	}
	function setDir(card, dir) {
		card.classList.remove('dir-tl', 'dir-tr', 'dir-bl', 'dir-br');
		if (dir) card.classList.add('dir-' + dir);
	}
	function placeCard(card) {
		if (!card.dataset.parent && !card.dataset.stop && card.dataset.sel !== '1') {
			if (card.parentElement !== chatlog) chatlog.append(card);
			card.style.position = card.style.top = card.style.left = card.style.width = '';
			setDir(card, null);
			chatlog.scrollTop = chatlog.scrollHeight;
			return;
		}
		const parent = card.dataset.parent && document.getElementById('qa-' + card.dataset.parent);
		if (parent) {
			const box = parent.querySelector(':scope > .qa-replybox');
			if (card.parentElement !== parent || (box && card.nextElementSibling !== box)) {
				parent.insertBefore(card, box || null);
			}
			card.style.position = card.style.top = card.style.left = card.style.width = '';
			setDir(card, null);
			return;
		}
		const rooms = sideRooms();
		if (rooms.left || rooms.right) {
			if (card.parentElement !== rail) rail.append(card);
			return;
		}
		const host = card.dataset.stop && document.getElementById(card.dataset.stop);
		const target = host || mainEl;
		if (card.parentElement !== target) target.append(card);
		card.style.position = card.style.top = card.style.left = card.style.width = '';
		setDir(card, 'tl');
	}
	function layoutRail() {
		const all = [...document.querySelectorAll('.qa')];
		all.forEach(placeCard);
		const cards = all.filter(c =>
			!(c.dataset.parent && document.getElementById('qa-' + c.dataset.parent)) && !chatlog.contains(c));
		const rooms = sideRooms();
		if (!rooms.left && !rooms.right) return;
		const anchored = cards.map(card => {
			const range = askedRanges.get(card.id.slice(3));
			let y = null;
			if (range) { const b = lineBands(range)[0]; if (b) y = b.top + scrollY; }
			if (y == null) {
				const host = card.dataset.stop && document.getElementById(card.dataset.stop);
				y = (host || mainEl).getBoundingClientRect().top + scrollY;
			}
			return { card, y };
		}).sort((a, b) => a.y - b.y);
		const bottoms = { left: -1e9, right: -1e9 };
		for (const { card, y } of anchored) {
			let side = 'right';
			if (rooms.left && rooms.right) {
				side = Math.max(y, bottoms.left + 12) <= Math.max(y, bottoms.right + 12) ? 'left' : 'right';
			} else if (rooms.left) side = 'left';
			const room = rooms[side];
			const top = Math.max(y, bottoms[side] + 12);
			card.style.position = 'absolute';
			card.style.top = top + 'px';
			card.style.left = room.x + scrollX + 'px';
			card.style.width = room.width + 'px';
			bottoms[side] = top + card.offsetHeight;
			const vert = y > top + card.offsetHeight / 2 ? 'b' : 't';
			setDir(card, vert + (side === 'left' ? 'r' : 'l'));
		}
	}
	window.addEventListener('resize', () => { paintHl(); layoutRail(); });

	function hideAsk() {
		chip.style.display = 'none';
		pop.style.display = 'none';
		askingRange = null;
		paintHl();
	}

	document.addEventListener('pointerup', e => {
		if (chip.contains(e.target) || pop.contains(e.target)) return;
		setTimeout(placeChip, 1);
	});
	document.addEventListener('keydown', e => { if (e.key === 'Escape') hideAsk(); });

	function placeChip() {
		if (pop.style.display === 'block') return;
		const s = getSelection();
		const text = s ? String(s).trim() : '';
		if (!text || text.length < 2 || s.isCollapsed) { chip.style.display = 'none'; return; }
		let node = s.anchorNode;
		if (node && node.nodeType !== 1) node = node.parentElement;
		if (!node || node.closest('#askpop, #toc, #chatbox, .qa-replybox')) { chip.style.display = 'none'; return; }
		let card = node.closest('.qa');
		while (card && card.dataset.parent) {
			const up = document.getElementById('qa-' + card.dataset.parent);
			if (!up) break;
			card = up;
		}
		if (!mainEl.contains(node) && !card) { chip.style.display = 'none'; return; }
		const stop = card ? null : node.closest('ol.steps > li[id]');
		const r = s.getRangeAt(0).getBoundingClientRect();
		sel = {
			text: text.slice(0, 2000),
			stop: card ? (card.dataset.stop || '') : (stop ? stop.id : ''),
			parent: card ? card.id.slice(3) : '',
		};
		chip.style.top = scrollY + r.bottom + 8 + 'px';
		chip.style.left = scrollX + Math.max(8, Math.min(r.left + r.width / 2 - 24, innerWidth - 90)) + 'px';
		chip.style.display = 'block';
	}

	function startQuoteReply(card, text, range) {
		const box = card.querySelector(':scope > .qa-replybox');
		if (!box) return;
		card._quote = { text, range };
		let q = box.querySelector('.qa-quote');
		if (!q) {
			q = document.createElement('div');
			q.className = 'qa-quote';
			const label = document.createElement('span');
			const x = document.createElement('button');
			x.type = 'button';
			x.textContent = '×';
			x.addEventListener('click', () => { card._quote = null; q.remove(); askingRange = null; paintHl(); });
			q.append(label, x);
			box.prepend(q);
		}
		q.querySelector('span').textContent = text.length > 90 ? text.slice(0, 90) + '…' : text;
		if (range) { askingRange = range; paintHl(); }
		getSelection().removeAllRanges();
		box.querySelector('input').focus();
	}

	chip.addEventListener('click', () => {
		const s = getSelection();
		savedRange = s && s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
		if (sel && sel.parent) {
			chip.style.display = 'none';
			const card = document.getElementById('qa-' + sel.parent);
			if (card) startQuoteReply(card, sel.text, savedRange);
			savedRange = null;
			return;
		}
		askingRange = savedRange;
		paintHl();
		pop.style.top = chip.style.top;
		pop.style.left = chip.style.left;
		chip.style.display = 'none';
		pop.style.display = 'block';
		askInput.value = '';
		askInput.focus();
	});

	function newId() {
		return crypto.randomUUID ? crypto.randomUUID()
			: 'q' + Math.random().toString(36).slice(2) + Date.now().toString(36);
	}
	function submitQuestion(rec) {
		pendingSince[rec.id] = Date.now();
		upsertCard(rec, undefined);
		layoutRail();
		fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec) })
			.then(r => { if (!r.ok) throw 0; startPolling(); })
			.catch(() => setStatus(rec.id, 'failed to send, is serve.py still running?'));
	}

	askInput.addEventListener('keydown', e => {
		if (menu.style.display === 'block') {
			if (e.key === 'ArrowDown') { e.preventDefault(); menuIdx = (menuIdx + 1) % menuHits.length; updateMenu(); return; }
			if (e.key === 'ArrowUp') { e.preventDefault(); menuIdx = (menuIdx + menuHits.length - 1) % menuHits.length; updateMenu(); return; }
			if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickSkill(); return; }
			if (e.key === 'Escape') { e.stopPropagation(); closeMenu(); return; }
		}
		if (e.key !== 'Enter') return;
		const question = askInput.value.trim();
		if (!question || !sel) return;
		const id = newId();
		if (savedRange) askedRanges.set(id, savedRange);
		savedRange = null;
		hideAsk();
		getSelection().removeAllRanges();
		submitQuestion({ id, stop: sel.stop, selection: sel.text, question, parent: sel.parent || '' });
	});

	function esc(t) { return t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
	function inline(t) {
		return t
			.replace(/\[([^\]]+)\]\(((?:cursor|vscode|https?):[^)\s]+)\)/g, '<a href="$2">$1</a>')
			.replace(/`([^`]+)`/g, '<code>$1</code>');
	}
	function renderFlow(text) {
		const steps = text.split('->').map(s => s.trim()).filter(Boolean);
		return '<div class="qa-flow">' + steps.map((s, i) =>
			(i ? '<span class="arw">→</span>' : '') + '<span class="step">' + inline(esc(s)) + '</span>').join('') + '</div>';
	}
	function safeSvg(src) {
		return src.trim().startsWith('<svg')
			&& !/<script|on\w+\s*=|foreignObject|javascript:|<iframe|href\s*=\s*["']?\s*https?:/i.test(src);
	}
	function renderPlain(text) {
		const out = [];
		let bullets = null;
		for (const line of text.split('\n')) {
			const t = line.trim();
			if (t.startsWith('flow:')) { bullets = null; out.push(renderFlow(t.slice(5))); continue; }
			if (t.startsWith('- ')) {
				if (!bullets) { bullets = []; out.push(bullets); }
				bullets.push('<li>' + inline(esc(t.slice(2))) + '</li>');
			} else {
				bullets = null;
				if (t) out.push('<p>' + inline(esc(t)) + '</p>');
			}
		}
		return out.map(x => Array.isArray(x) ? '<ul>' + x.join('') + '</ul>' : x).join('');
	}
	function renderAnswer(text) {
		const parts = text.split(/```(\w*)\n?([\s\S]*?)```/);
		let html = '';
		for (let i = 0; i < parts.length; i += 3) {
			html += renderPlain(parts[i]);
			const lang = (parts[i + 1] || '').toLowerCase();
			const code = parts[i + 2];
			if (code === undefined) break;
			if (lang === 'flow') html += renderFlow(code);
			else if (lang === 'svg' && safeSvg(code)) html += '<div class="qa-svg">' + code + '</div>';
			else html += '<pre><code>' + esc(code) + '</code></pre>';
		}
		return html;
	}

	function upsertCard(q, answer) {
		let card = document.getElementById('qa-' + q.id);
		if (!card) {
			card = document.createElement('div');
			card.className = q.parent ? 'qa reply' : 'qa';
			card.id = 'qa-' + q.id;
			card.dataset.sel = q.selection ? '1' : '';
			card.addEventListener('mouseenter', () =>
				hlLayer.querySelectorAll('.hl[data-qid="' + q.id + '"]').forEach(d => d.classList.add('lit')));
			card.addEventListener('mouseleave', () =>
				hlLayer.querySelectorAll('.hl.lit').forEach(d => d.classList.remove('lit')));
			if (q.selection) {
				const selP = document.createElement('p');
				selP.className = 'qa-sel';
				selP.textContent = q.selection.length > 220 ? q.selection.slice(0, 220) + '…' : q.selection;
				card.append(selP);
			}
			const qP = document.createElement('p');
			qP.className = 'qa-q';
			qP.textContent = q.question;
			const aDiv = document.createElement('div');
			aDiv.className = 'qa-a';
			const status = document.createElement('p');
			status.className = 'qa-status';
			card.append(qP, aDiv, status);
			card.dataset.stop = q.stop || '';
			card.dataset.parent = q.parent || '';
			if (!q.parent) {
				const box = document.createElement('div');
				box.className = 'qa-replybox';
				const inp = document.createElement('input');
				inp.placeholder = 'reply…';
				box.append(inp);
				card.append(box);
				inp.addEventListener('keydown', e => {
					if (e.key !== 'Enter') return;
					const question = inp.value.trim();
					if (!question) return;
					inp.value = '';
					const quote = card._quote;
					card._quote = null;
					const chipQ = box.querySelector('.qa-quote');
					if (chipQ) chipQ.remove();
					const id = newId();
					if (quote && quote.range) askedRanges.set(id, quote.range);
					askingRange = null;
					submitQuestion({ id, stop: card.dataset.stop || '', selection: quote ? quote.text : '', question, parent: q.id });
					paintHl();
				});
			}
			placeCard(card);
		}
		if (answer !== undefined) {
			delete pendingSince[q.id];
			if (card.dataset.answered !== '1') {
				card.dataset.answered = '1';
				card.querySelector('.qa-a').innerHTML = renderAnswer(answer);
				card.querySelector('.qa-status').textContent = '';
			}
		} else {
			if (!(q.id in pendingSince)) pendingSince[q.id] = Date.now();
			const waited = Date.now() - pendingSince[q.id];
			setStatus(q.id, waited > 60000 ? 'queued, no session listening; it stays saved' : 'answering…');
		}
	}
	function setStatus(id, text) {
		const card = document.getElementById('qa-' + id);
		if (card) card.querySelector('.qa-status').textContent = text;
	}

	// Rebuild a Range from the stored selection text, so yellow survives reload.
	const rangeTried = new Set();
	function findRange(root, needle) {
		const norm = needle.replace(/\s+/g, ' ').trim();
		if (!norm) return null;
		const rootCard = root.closest ? root.closest('.qa') : null;
		const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
			acceptNode(n) {
				const p = n.parentElement;
				if (rootCard) {
					if (p.closest('.qa') !== rootCard || p.closest('.qa-sel')) return NodeFilter.FILTER_REJECT;
					return NodeFilter.FILTER_ACCEPT;
				}
				return p.closest('.qa, #askpop, #toc, #hl-layer')
					? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
			},
		});
		let hay = '';
		const map = [];
		for (let n; (n = walker.nextNode());) {
			const t = n.nodeValue;
			for (let i = 0; i < t.length; i++) {
				const ws = /\s/.test(t[i]);
				if (ws && (hay === '' || hay.endsWith(' '))) continue;
				hay += ws ? ' ' : t[i];
				map.push({ n, i });
			}
		}
		const at = hay.indexOf(norm);
		if (at < 0) return null;
		const s = map[at];
		const e = map[at + norm.length - 1];
		const range = document.createRange();
		range.setStart(s.n, s.i);
		range.setEnd(e.n, e.i + 1);
		return range;
	}
	function restoreRanges(questions) {
		for (const q of questions) {
			if (askedRanges.has(q.id) || rangeTried.has(q.id) || !q.selection) continue;
			rangeTried.add(q.id);
			const parent = q.parent && document.getElementById('qa-' + q.parent);
			const root = parent || (q.stop && document.getElementById(q.stop)) || mainEl;
			const range = findRange(root, q.selection) || (!parent && root !== mainEl && findRange(mainEl, q.selection));
			if (range) askedRanges.set(q.id, range);
		}
	}

	async function syncQA() {
		try {
			const r = await fetch('/qa.json', { cache: 'no-store' });
			const d = await r.json();
			const answers = {};
			for (const a of d.answers) answers[a.id] = a.answer;
			let pending = false;
			for (const q of d.questions) {
				upsertCard(q, answers[q.id]);
				if (answers[q.id] === undefined) pending = true;
			}
			restoreRanges(d.questions);
			if (pending) startPolling(); else stopPolling();
			paintHl();
			layoutRail();
		} catch (e) { /* server gone; leave the cards as they are */ }
	}
	function startPolling() { if (!pollTimer) pollTimer = setInterval(syncQA, 2000); }
	function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
	syncQA();
</script>

</body>
</html>
