<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #1a1a1a;
		--muted: #6b7280;
		--line: #e5e7eb;
		--accent: #0439d7;
		--code-bg: #f6f7f9;
		--say-bg: #f0f4ff;
		--panel: #ffffff;
		--shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .07);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #14161a;
			--fg: #e8e8ea;
			--muted: #9aa0aa;
			--line: #2a2e35;
			--accent: #7aa2ff;
			--code-bg: #1c1f25;
			--say-bg: #1a2030;
			--panel: #1a1d23;
			--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 2.5rem 1.25rem 6rem;
		background: var(--bg);
		color: var(--fg);
		font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
	}
	/* Floating sidebar: detached from the edge, rounded, its own surface. */
	#toc {
		position: fixed;
		top: 1.5rem;
		left: 1.5rem;
		width: 244px;
		max-height: calc(100vh - 3rem);
		overflow-y: auto;
		overscroll-behavior: contain;
		padding: 1.1rem .8rem 1.3rem;
		border: 1px solid var(--line);
		border-radius: 14px;
		background: var(--panel);
		box-shadow: var(--shadow);
		font-size: .82rem;
		line-height: 1.45;
		scrollbar-width: thin;
	}
	#toc::-webkit-scrollbar { width: 6px; }
	#toc::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
	.toc-title { font-weight: 700; letter-spacing: .06em; margin: 0 0 .8rem .35rem; font-size: .72rem; text-transform: uppercase; color: var(--muted); }
	#toc ol { list-style: none; margin: 0; padding: 0; }
	#toc ol.sub { margin: .2rem 0 .8rem .45rem; padding-left: .6rem; border-left: 1px solid var(--line); }
	#toc a { display: block; padding: .2rem .45rem; border-radius: 7px; color: var(--muted); text-decoration: none; transition: background .12s, color .12s; }
	#toc a:hover { background: var(--code-bg); color: var(--fg); }
	#toc a.sec { color: var(--fg); font-weight: 600; margin-top: .45rem; }
	#toc ol.sub a { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .735rem; }
	#toc a.active { color: var(--accent); background: var(--say-bg); font-weight: 600; }

	/* Content stays centred in the space left of the sidebar, not shoved right. */
	main { max-width: 780px; margin: 0 auto; padding-left: 276px; }
	@supports (width: min(1px, 1px)) {
		main { padding-left: 0; width: min(780px, 100%); margin-left: max(276px, calc(50vw - 390px)); margin-right: auto; }
	}
	:target { scroll-margin-top: 1.75rem; }
	@media (max-width: 1240px) {
		#toc { display: none; }
		main { margin: 0 auto; padding-left: 0; width: min(780px, 100%); }
	}
	h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
	.sub { color: var(--muted); margin: 0 0 2.5rem; font-size: .95rem; }
	h2 {
		font-size: 1.15rem;
		margin: 3rem 0 .35rem;
		padding-bottom: .5rem;
		border-bottom: 2px solid var(--line);
	}
	h2 .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
	h3 { font-size: .95rem; margin: 2rem 0 .5rem; color: var(--muted); font-weight: 600; }
	code, .path {
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: .875em;
	}
	a.path { text-decoration: none; }
	a.path:hover { border-color: var(--accent); }
	.path {
		display: inline-block;
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 4px;
		padding: .1rem .4rem;
		color: var(--accent);
	}
	pre {
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 6px;
		padding: .75rem 1rem;
		overflow-x: auto;
		margin: .6rem 0;
	}
	pre code { font-size: .82rem; line-height: 1.5; }
	ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
	ol.steps > li {
		counter-increment: s;
		position: relative;
		padding: 0 0 1.4rem 2.25rem;
		border-left: 2px solid var(--line);
		margin-left: .6rem;
	}
	ol.steps > li:last-child { border-left-color: transparent; }
	ol.steps > li::before {
		content: counter(s);
		position: absolute;
		left: -0.85rem;
		top: 0;
		width: 1.65rem;
		height: 1.65rem;
		border-radius: 50%;
		background: var(--accent);
		color: #fff;
		font-size: .8rem;
		font-weight: 600;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.action { font-weight: 600; }
	.say {
		background: var(--say-bg);
		border-left: 3px solid var(--accent);
		padding: .55rem .85rem;
		margin: .5rem 0 0;
		border-radius: 0 4px 4px 0;
		font-size: .93rem;
	}
	.say::before {
		content: "SAY";
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		color: var(--accent);
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.ask {
		border-left: 3px solid var(--muted);
		padding: .5rem .85rem;
		margin: .5rem 0 0;
		font-size: .9rem;
		color: var(--muted);
	}
	.ask::before {
		content: "HE'LL ASK";
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.ask b { color: var(--fg); font-weight: 600; }
	.say ul, .ask ul { margin: .1rem 0 0; padding-left: 1.05rem; }
	.say li, .ask li { margin: .12rem 0; }
	.note {
		border: 1px dashed var(--line);
		border-radius: 6px;
		padding: .85rem 1rem;
		margin: 1.25rem 0;
		font-size: .92rem;
		color: var(--muted);
	}
	.note strong { color: var(--fg); }
	table { border-collapse: collapse; width: 100%; margin: .5rem 0 0; font-size: .92rem; }
	th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
	th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
	ul.plain { padding-left: 1.1rem; margin: .4rem 0; }
	ul.plain li { margin-bottom: .3rem; }
	/* Ask-from-selection: floating chip, question input, pinned Q&A card. */
	#askchip, #askpop { position: absolute; z-index: 60; }
	#askchip {
		display: none;
		padding: .3rem .75rem;
		border: 0;
		border-radius: 999px;
		background: var(--accent);
		color: #fff;
		font-size: .78rem;
		font-weight: 600;
		cursor: pointer;
		box-shadow: var(--shadow);
	}
	#askpop {
		display: none;
		width: min(420px, 90vw);
		padding: .4rem;
		border: 1px solid var(--line);
		border-radius: 10px;
		background: var(--panel);
		box-shadow: var(--shadow);
	}
	#askpop input {
		width: 100%;
		border: 0;
		outline: none;
		background: transparent;
		color: var(--fg);
		font: inherit;
		font-size: .9rem;
		padding: .25rem .35rem;
	}
	.qa {
		border: 1px solid var(--line);
		border-left: 3px solid var(--accent);
		border-radius: 0 6px 6px 0;
		background: var(--panel);
		padding: .55rem .85rem .6rem;
		margin: .6rem 0 0;
		font-size: .9rem;
	}
	.qa::before {
		content: "ASKED";
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		color: var(--accent);
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.qa-sel {
		color: var(--muted);
		border-left: 2px solid var(--line);
		padding-left: .5rem;
		margin: 0 0 .25rem;
		font-size: .82rem;
		overflow-wrap: anywhere;
	}
	.qa-q { font-weight: 600; margin: 0; }
	.qa-a { margin: .3rem 0 0; }
	.qa-a p { margin: .15rem 0 0; }
	.qa-a ul { margin: .1rem 0 0; padding-left: 1.05rem; }
	.qa-a li { margin: .12rem 0; }
	.qa-status { color: var(--muted); font-size: .78rem; margin: .3rem 0 0; }
</style>
</head>
<body>
{{NAV}}
<main>

<h1>{{TITLE}}</h1>
<p class="sub">{{SUBTITLE}}</p>

{{BODY}}

</main>
<script>
	const links = [...document.querySelectorAll('#toc a')];
	const targets = links.map(a => document.getElementById(a.hash.slice(1))).filter(Boolean);
	const spy = new IntersectionObserver(entries => {
		entries.forEach(e => {
			if (!e.isIntersecting) return;
			links.forEach(a => a.classList.toggle('active', a.hash === '#' + e.target.id));
		});
	}, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
	targets.forEach(t => spy.observe(t));

	// Ask-from-selection: POST to serve.py, poll /qa.json, pin cards under stops.
	const mainEl = document.querySelector('main');
	const chip = document.createElement('button');
	chip.id = 'askchip';
	chip.type = 'button';
	chip.textContent = 'Ask';
	const pop = document.createElement('div');
	pop.id = 'askpop';
	const askInput = document.createElement('input');
	askInput.placeholder = 'ask about this selection…';
	pop.append(askInput);
	document.body.append(chip, pop);

	let sel = null;
	const pendingSince = {};
	let pollTimer = null;

	function hideAsk() { chip.style.display = 'none'; pop.style.display = 'none'; }

	document.addEventListener('pointerup', e => {
		if (chip.contains(e.target) || pop.contains(e.target)) return;
		setTimeout(placeChip, 1);
	});
	document.addEventListener('keydown', e => { if (e.key === 'Escape') hideAsk(); });

	function placeChip() {
		if (pop.style.display === 'block') return;
		const s = getSelection();
		const text = s ? String(s).trim() : '';
		if (!text || text.length < 2 || s.isCollapsed) { chip.style.display = 'none'; return; }
		let node = s.anchorNode;
		if (node && node.nodeType !== 1) node = node.parentElement;
		if (!node || !mainEl.contains(node)) { chip.style.display = 'none'; return; }
		const stop = node.closest('ol.steps > li[id]');
		const r = s.getRangeAt(0).getBoundingClientRect();
		sel = { text: text.slice(0, 2000), stop: stop ? stop.id : '' };
		chip.style.top = scrollY + r.bottom + 8 + 'px';
		chip.style.left = scrollX + Math.max(8, Math.min(r.left + r.width / 2 - 24, innerWidth - 90)) + 'px';
		chip.style.display = 'block';
	}

	chip.addEventListener('click', () => {
		pop.style.top = chip.style.top;
		pop.style.left = chip.style.left;
		chip.style.display = 'none';
		pop.style.display = 'block';
		askInput.value = '';
		askInput.focus();
	});

	askInput.addEventListener('keydown', e => {
		if (e.key !== 'Enter') return;
		const question = askInput.value.trim();
		if (!question || !sel) return;
		hideAsk();
		getSelection().removeAllRanges();
		const id = crypto.randomUUID ? crypto.randomUUID()
			: 'q' + Math.random().toString(36).slice(2) + Date.now().toString(36);
		const rec = { id, stop: sel.stop, selection: sel.text, question };
		pendingSince[id] = Date.now();
		upsertCard(rec, undefined);
		fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec) })
			.then(r => { if (!r.ok) throw 0; startPolling(); })
			.catch(() => setStatus(id, 'failed to send, is serve.py still running?'));
	});

	function esc(t) { return t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
	function inline(t) {
		return t
			.replace(/\[([^\]]+)\]\(((?:cursor|vscode|https?):[^)\s]+)\)/g, '<a href="$2">$1</a>')
			.replace(/`([^`]+)`/g, '<code>$1</code>');
	}
	function renderAnswer(text) {
		const out = [];
		let bullets = null;
		for (const line of text.split('\n')) {
			const t = line.trim();
			if (t.startsWith('- ')) {
				if (!bullets) { bullets = []; out.push(bullets); }
				bullets.push('<li>' + inline(esc(t.slice(2))) + '</li>');
			} else {
				bullets = null;
				if (t) out.push('<p>' + inline(esc(t)) + '</p>');
			}
		}
		return out.map(x => Array.isArray(x) ? '<ul>' + x.join('') + '</ul>' : x).join('');
	}

	function upsertCard(q, answer) {
		let card = document.getElementById('qa-' + q.id);
		if (!card) {
			card = document.createElement('div');
			card.className = 'qa';
			card.id = 'qa-' + q.id;
			const selP = document.createElement('p');
			selP.className = 'qa-sel';
			selP.textContent = q.selection.length > 220 ? q.selection.slice(0, 220) + '…' : q.selection;
			const qP = document.createElement('p');
			qP.className = 'qa-q';
			qP.textContent = q.question;
			const aDiv = document.createElement('div');
			aDiv.className = 'qa-a';
			const status = document.createElement('p');
			status.className = 'qa-status';
			card.append(selP, qP, aDiv, status);
			const host = q.stop && document.getElementById(q.stop);
			(host || mainEl).append(card);
		}
		if (answer !== undefined) {
			delete pendingSince[q.id];
			card.querySelector('.qa-a').innerHTML = renderAnswer(answer);
			card.querySelector('.qa-status').textContent = '';
		} else {
			if (!(q.id in pendingSince)) pendingSince[q.id] = Date.now();
			const waited = Date.now() - pendingSince[q.id];
			setStatus(q.id, waited > 60000 ? 'queued, no session listening; it stays saved' : 'answering…');
		}
	}
	function setStatus(id, text) {
		const card = document.getElementById('qa-' + id);
		if (card) card.querySelector('.qa-status').textContent = text;
	}

	async function syncQA() {
		try {
			const r = await fetch('/qa.json', { cache: 'no-store' });
			const d = await r.json();
			const answers = {};
			for (const a of d.answers) answers[a.id] = a.answer;
			let pending = false;
			for (const q of d.questions) {
				upsertCard(q, answers[q.id]);
				if (answers[q.id] === undefined) pending = true;
			}
			if (pending) startPolling(); else stopPolling();
		} catch (e) { /* server gone; leave the cards as they are */ }
	}
	function startPolling() { if (!pollTimer) pollTimer = setInterval(syncQA, 2000); }
	function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
	syncQA();
</script>

</body>
</html>
