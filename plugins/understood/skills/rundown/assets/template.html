<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #1a1a1a;
		--muted: #6b7280;
		--line: #e5e7eb;
		--accent: #0439d7;
		--code-bg: #f6f7f9;
		--say-bg: #f0f4ff;
		--panel: #ffffff;
		--shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .07);
		--hl-asking: rgba(84, 143, 255, .30);
		--hl-asked: rgba(255, 200, 40, .35);
		--hl-lit: rgba(255, 200, 40, .55);
		--hl-strong: rgba(255, 186, 0, .85);
		--hook-core: rgba(4, 57, 215, .38);
		--hook-mid: rgba(4, 57, 215, .16);
		--ba-bad: rgba(220, 60, 60, .07);
		--ba-bad-fg: #c0392b;
		--ba-good: rgba(40, 160, 90, .08);
		--ba-good-fg: #1f9d55;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #14161a;
			--fg: #e8e8ea;
			--muted: #9aa0aa;
			--line: #2a2e35;
			--accent: #7aa2ff;
			--code-bg: #1c1f25;
			--say-bg: #1a2030;
			--panel: #1a1d23;
			--shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
			--hl-asking: rgba(122, 162, 255, .32);
			--hl-asked: rgba(255, 213, 79, .22);
			--hl-lit: rgba(255, 213, 79, .4);
			--hl-strong: rgba(255, 213, 79, .72);
			--hook-core: rgba(122, 162, 255, .5);
			--hook-mid: rgba(122, 162, 255, .2);
			--ba-bad: rgba(220, 60, 60, .12);
			--ba-bad-fg: #e07b6d;
			--ba-good: rgba(40, 160, 90, .12);
			--ba-good-fg: #5fc98e;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 2.5rem 1.25rem 6rem;
		background: var(--bg);
		color: var(--fg);
		font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
	}
	/* Floating sidebar: detached from the edge, rounded, its own surface. */
	#toc {
		position: fixed;
		top: 1.5rem;
		left: 1.5rem;
		width: 244px;
		max-height: calc(100vh - 3rem);
		overflow-y: auto;
		overscroll-behavior: contain;
		padding: 1.1rem .8rem 1.3rem;
		border: 1px solid var(--line);
		border-radius: 14px;
		background: var(--panel);
		box-shadow: var(--shadow);
		font-size: .82rem;
		line-height: 1.45;
		scrollbar-width: thin;
	}
	#toc::-webkit-scrollbar { width: 6px; }
	#toc::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
	.toc-title { font-weight: 700; letter-spacing: .06em; margin: 0 0 .8rem .35rem; font-size: .72rem; text-transform: uppercase; color: var(--muted); }
	#toc ol { list-style: none; margin: 0; padding: 0; }
	#toc ol.sub { margin: .2rem 0 .8rem .45rem; padding-left: .6rem; border-left: 1px solid var(--line); }
	#toc a { display: block; padding: .2rem .45rem; border-radius: 7px; color: var(--muted); text-decoration: none; transition: background .12s, color .12s; }
	#toc a:hover { background: var(--code-bg); color: var(--fg); }
	#toc a.sec { color: var(--fg); font-weight: 600; margin-top: .45rem; }
	#toc ol.sub a { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .735rem; }
	#toc a.active { color: var(--accent); background: var(--say-bg); font-weight: 600; }

	/* Content stays centred in the space left of the sidebar, not shoved right. */
	main { max-width: 780px; width: min(780px, 100%); margin-left: max(276px, calc(50vw - 390px)); margin-right: auto; }
	:target { scroll-margin-top: 1.75rem; }
	@media (max-width: 1080px) {
		#toc { display: none; }
		main { margin: 0 auto; padding-left: 0; width: min(780px, 100%); }
	}
	h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
	.sub { color: var(--muted); margin: 0 0 2.5rem; font-size: .95rem; }
	h2 {
		font-size: 1.15rem;
		margin: 3rem 0 .35rem;
		padding-bottom: .5rem;
		border-bottom: 2px solid var(--line);
	}
	h2 .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
	h3 { font-size: .95rem; margin: 2rem 0 .5rem; color: var(--muted); font-weight: 600; }
	code, .path {
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: .875em;
	}
	a.path { text-decoration: none; }
	a.path:hover { border-color: var(--accent); }
	.path {
		display: inline-block;
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 4px;
		padding: .1rem .4rem;
		color: var(--accent);
	}
	pre {
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 6px;
		padding: .75rem 1rem;
		overflow-x: auto;
		margin: .6rem 0;
	}
	pre code { font-size: .82rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
	ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; }
	ol.steps > li {
		counter-increment: s;
		position: relative;
		padding: 0 0 1.4rem 2.25rem;
		border-left: 2px solid var(--line);
		margin-left: .6rem;
	}
	ol.steps > li:last-child { border-left-color: transparent; }
	ol.steps > li::before {
		content: counter(s);
		position: absolute;
		left: -0.85rem;
		top: 0;
		width: 1.65rem;
		height: 1.65rem;
		border-radius: 50%;
		background: var(--accent);
		color: #fff;
		font-size: .8rem;
		font-weight: 600;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.action { font-weight: 600; }
	.say {
		background: var(--say-bg);
		border-left: 3px solid var(--accent);
		padding: .55rem .85rem;
		margin: .5rem 0 0;
		border-radius: 0 4px 4px 0;
		font-size: .93rem;
	}
	/* Shared eyebrow-label recipe; each block sets only its text and color. */
	.say::before, .ask::before, .qa::before {
		display: block;
		font-size: .65rem;
		letter-spacing: .09em;
		font-weight: 700;
		margin-bottom: .15rem;
	}
	.say::before { content: "KEYWORD"; color: var(--accent); }
	.ask {
		border-left: 3px solid var(--muted);
		padding: .5rem .85rem;
		margin: .5rem 0 0;
		font-size: .9rem;
		color: var(--muted);
	}
	.ask::before { content: "KNOW MORE"; }
	.ask b { color: var(--fg); font-weight: 600; }
	.say ul, .ask ul, .qa-a ul { margin: .1rem 0 0; padding-left: 1.05rem; }
	.say li, .ask li, .qa-a li { margin: .12rem 0; }
	.note {
		border: 1px dashed var(--line);
		border-radius: 6px;
		padding: .85rem 1rem;
		margin: 1.25rem 0;
		font-size: .92rem;
		color: var(--muted);
	}
	.note strong { color: var(--fg); }
	table { border-collapse: collapse; width: 100%; margin: .5rem 0 0; font-size: .92rem; }
	th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
	th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
	ul.plain { padding-left: 1.1rem; margin: .4rem 0; }
	ul.plain li { margin-bottom: .3rem; }
	/* Data-first components: pipeline block, IN/OUT boundary, stage tag, BEFORE/AFTER pair. */
	.pipe { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); padding: 1.1rem 1.25rem; margin: 1.25rem 0 0; }
	.pipe .pt { font-size: .68rem; letter-spacing: .09em; font-weight: 700; color: var(--accent); text-transform: uppercase; margin: 0 0 .6rem; }
	.pipe ol { list-style: none; margin: 0; padding: 0; }
	.pipe li { position: relative; padding: .28rem 0 .28rem 1.4rem; font-size: .92rem; }
	.pipe li::before { content: "\2192"; position: absolute; left: .15rem; color: var(--accent); font-weight: 600; }
	.pipe li:first-child::before { content: "\25CF"; font-size: .7rem; top: .48rem; }
	.pipe li .where { float: right; color: var(--muted); font-size: .72rem; font-family: ui-monospace, Menlo, monospace; padding-top: .15rem; }
	.pipe .foot { margin: .7rem 0 0; color: var(--muted); font-size: .8rem; }
	.rec { display: block; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: .45rem .6rem; margin: .4rem 0 0; font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
	.tag { float: right; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: var(--accent); background: var(--say-bg); border-radius: 999px; padding: .1rem .55rem; margin-left: .5rem; }
	h2 .tag { float: none; vertical-align: .15rem; }
	/* .io and .ba share the boxed-rows skeleton; only widths and colors differ. */
	.io, .ba { margin: .55rem 0 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
	.io div, .ba div { display: flex; gap: .6rem; padding: .4rem .6rem; align-items: baseline; }
	.io div { font-size: .87rem; }
	.ba div { font-size: .88rem; padding: .45rem .6rem; }
	.io div + div, .ba .a { border-top: 1px solid var(--line); }
	.io b, .ba b { font-size: .66rem; letter-spacing: .08em; }
	.io b { flex: 0 0 2.2rem; color: var(--accent); }
	.ba b { flex: 0 0 3.6rem; }
	.io span { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; overflow-wrap: anywhere; }
	.ba .b { background: var(--ba-bad); }
	.ba .b b { color: var(--ba-bad-fg); }
	.ba .a { background: var(--ba-good); }
	.ba .a b { color: var(--ba-good-fg); }
	/* Live-block chrome: card, header, button system, think-lines.
	   Block-specific css/js travels with the block markup (see assets/blocks.html). */
	.blk { margin-top: 1rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
	.blk-head { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; border-bottom: 1px solid var(--line); background: var(--code-bg); flex-wrap: wrap; }
	.btn {
		border: 1px solid var(--line); background: var(--panel); color: var(--fg);
		border-radius: 8px; padding: .2rem .7rem; cursor: pointer;
		font-family: inherit; font-size: .82rem;
		transition: border-color .15s, color .15s, background .15s, transform .06s, opacity .15s;
	}
	.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
	.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
	.btn:disabled { opacity: .45; cursor: default; }
	.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
	.btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.12); }
	.btn.on { background: var(--say-bg); border-color: var(--accent); color: var(--accent); }
	.btn.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .76rem; }
	/* Think lines: a real bullet list in a hand, because these get copied into notes.
	   One proof renders flat, two or more nest; the renderer decides, never the author. */
	ul.think {
		margin: .6rem 0 0;
		padding-left: 1.15rem;
		font-family: "Noteworthy", "Chalkboard SE", cursive;
		font-size: 1.02rem;
		line-height: 1.75;
	}
	ul.think > li { margin: .45rem 0; }
	ul.think li::marker { color: var(--accent); }
	ul.think ul { list-style: circle; margin: .25rem 0 .45rem; padding-left: 1.1rem; }
	ul.think ul li { margin: .2rem 0; color: var(--muted); }
	.arw { color: var(--accent); font-weight: 600; }
	.build { color: var(--muted); font-size: .8em; }
	/* Block internals. Every block draws its resting state server side and the
	   runtime below wires the interaction from its config. */
	.blk-body { padding: .7rem .8rem; font-size: .9rem; }
	.blk-head .hint { font-size: .8rem; color: var(--muted); }
	.blk-head .ref { margin-left: auto; }
	.blk-head .ref:empty { display: none; }
	.blk-head .state {
		margin-left: auto; font-size: .66rem; letter-spacing: .09em; text-transform: uppercase;
		font-weight: 700; color: var(--accent); background: var(--say-bg);
		border-radius: 999px; padding: .12rem .55rem; white-space: nowrap;
	}
	.blk-head .state.off { color: var(--ba-bad-fg); background: var(--ba-bad); }
	.blk .ln:first-child { margin-top: 0; }
	.blk .res { margin-top: .45rem; padding-top: .4rem; border-top: 1px solid var(--line); }
	.tgl { width: 44px; height: 24px; border-radius: 999px; border: 1px solid var(--line); background: var(--accent); position: relative; cursor: pointer; flex: 0 0 auto; transition: background .25s; }
	.tgl .knob { position: absolute; top: 2px; left: 22px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .25s; }
	.blk .ln, .blk .res, .blk .row, .blk .val, .blk .read, .blk .route { margin: .2rem 0; }
	.blk .row, .blk .art { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
	.blk .row { border: 1px solid var(--line); border-radius: 6px; padding: .35rem .5rem; background: var(--code-bg); }
	.blk .log { color: var(--muted); line-height: 1.7; margin-top: .4rem; min-height: 1.2rem; }
	.tone-good { color: var(--ba-good-fg); }
	.tone-bad { color: var(--ba-bad-fg); }
	.blk .hops { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
	.blk .hop { border: 1px solid var(--line); border-radius: 8px; padding: .25rem .55rem; cursor: pointer; transition: all .25s; }
	.blk .hop:hover { border-color: var(--accent); }
	.blk .hop.hot { border-color: var(--accent); background: var(--say-bg); }
	.blk .val { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; margin-top: .55rem; }
	.blk .val .k { font-size: .75rem; color: var(--muted); }
	.blk .val .v { border: 1px solid var(--accent); border-radius: 999px; padding: .1rem .6rem; font-size: .78rem; background: var(--say-bg); }
	.blk .desc, .blk .verdict, .blk .fields { margin-top: .4rem; color: var(--muted); min-height: 1.2rem; }
	.blk .rng { margin-left: auto; width: min(250px, 40%); accent-color: var(--accent); }
	.blk .count { margin-top: .4rem; }
	.blk .lock { display: flex; align-items: center; gap: .4rem; font-size: .85rem; cursor: pointer; }
	.blk .bd { background: var(--say-bg); border-bottom: 2px solid var(--accent); border-radius: 2px; transition: background .15s; }
	.blk .bd.glow, .blk .bl.glow { background: var(--hl-lit); }
	.blk .bl { transition: background .15s; border-radius: 4px; padding: 0 .25rem; cursor: default; }
	.blk .mapwrap { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
	.blk .mapnode { display: inline-block; text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: 9px; padding: .3rem .6rem; background: var(--panel); transition: border-color .15s, background .15s; }
	.blk .mapnode:hover { border-color: var(--accent); background: var(--say-bg); }
	.blk .mapnode b { display: block; font-size: .85rem; }
	.blk .mapnode span { display: block; font-size: .76rem; color: var(--muted); margin-top: .1rem; }
	.blk .space, .blk .ang { width: 100%; max-width: 520px; display: block; font-size: 8px; }
	.blk .space text, .blk .ang text { fill: currentColor; }
	.blk .space .pt { fill: var(--accent); opacity: .45; }
	.blk .space .pt.near { opacity: 1; stroke: var(--ba-good-fg); stroke-width: 2; }
	.blk .space .star { fill: var(--ba-bad-fg); font-size: 13px; transition: x .4s, y .4s; }
	.blk .anglewrap { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
	.blk .ang line, .blk .ang path, .blk .ang circle { fill: none; stroke: currentColor; }
	.blk .ang .qv { stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
	.blk .ang .pv { stroke: var(--ba-bad-fg); stroke-width: 3.5; stroke-linecap: round; }
	.blk .ang .arc { fill: var(--say-bg); stroke: var(--accent); stroke-width: 1; }
	.blk .ang .gate { stroke: var(--muted); stroke-dasharray: 4 3; opacity: .6; }
	.blk .ang circle { fill: currentColor; stroke: none; }
	.blk .bar { height: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
	.blk .bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .3s, background .3s; }
	.blk .pt { display: flex; gap: .3rem; align-items: center; font-size: .8rem; cursor: pointer; }
	.blk .dots { letter-spacing: .3em; color: var(--muted); }
	.blk .moment { min-height: 3rem; }
	/* Mermaid flowcharts, drawn to svg at build time: no library, no network. */
	.blk.flow .blk-body { padding: 1rem .8rem; overflow-x: auto; }
	svg.mmd { display: block; margin: 0 auto; max-width: 100%; height: auto; font-size: 12.5px; }
	svg.mmd .nd { fill: var(--panel); stroke: var(--line); stroke-width: 1.4; }
	svg.mmd .nd.store { fill: var(--code-bg); }
	svg.mmd text { fill: var(--fg); font-family: inherit; }
	svg.mmd .el { fill: var(--muted); font-size: 11px; }
	svg.mmd .elbg { fill: var(--bg); stroke: none; }
	svg.mmd .eg { fill: none; stroke: var(--muted); stroke-width: 1.4; }
	svg.mmd marker path { fill: var(--muted); stroke: none; }
	svg.mmd .nd-a { cursor: pointer; }
	svg.mmd .nd-a:hover .nd { stroke: var(--accent); fill: var(--say-bg); }
	svg.mmd .nd-a:hover text { fill: var(--accent); }
	.blk.flow .cap { margin: .6rem 0 0; color: var(--muted); font-size: .85rem; text-align: center; }
	/* Claim checks, generated on demand at the end. */
	#claims .cl { display: flex; gap: .6rem; align-items: baseline; padding: .35rem .4rem; border-radius: 7px; }
	#claims .cl .tick {
		flex: 0 0 auto; width: 1.15rem; height: 1.15rem; border: 1px solid var(--line);
		border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center;
		justify-content: center; font-size: .72rem; line-height: 1; color: transparent;
		transition: border-color .15s, background .15s, color .15s;
	}
	#claims .cl .tick::after { content: "\2713"; }
	#claims .cl .tick:hover { border-color: var(--accent); color: var(--muted); }
	#claims .cl.done .tick { border-color: var(--ba-good-fg); background: var(--ba-good); color: var(--ba-good-fg); }
	#claims .cl.done .txt { opacity: .5; }
	#cl-score { font-weight: 600; color: var(--accent); margin-left: auto; }
	/* Before the checks exist there is nothing to frame: the button stands alone. */
	.blk.bare.empty { border: 0; background: none; box-shadow: none; }
	.blk.bare.empty .blk-head { border: 0; background: none; padding-left: 0; }
	.blk.bare.empty .blk-body { display: none; }
	/* Ask-from-selection: floating chip, question input, pinned Q&A card. */
	#askchip, #askpop { position: absolute; z-index: 60; }
	#askchip {
		display: none;
		border-radius: 999px;
		overflow: hidden;
		box-shadow: var(--shadow);
	}
	#askchip button {
		border: 0;
		background: var(--accent);
		color: #fff;
		font-size: .78rem;
		font-weight: 600;
		font-family: inherit;
		padding: .3rem .7rem;
		cursor: pointer;
	}
	#askchip button + button { border-left: 1px solid rgba(255, 255, 255, .3); }
	#spot-quote { margin-bottom: .4rem; }
	#askpop {
		display: none;
		width: min(420px, 90vw);
		padding: .4rem;
		border: 1px solid var(--line);
		border-radius: 10px;
		background: var(--panel);
		box-shadow: var(--shadow);
	}
	/* Shared borderless-input recipe; per-context rules set only size and padding. */
	#askpop input, .qa-replybox input, #discuss-box input {
		width: 100%;
		border: 0;
		outline: none;
		background: transparent;
		color: var(--fg);
		font: inherit;
	}
	#askpop input::placeholder, .qa-replybox input::placeholder, #discuss-box input::placeholder { color: var(--muted); }
	#askpop input { font-size: .9rem; padding: .25rem .35rem; }
	#askmenu {
		display: none;
		margin-top: .25rem;
		border-top: 1px solid var(--line);
		padding-top: .25rem;
		max-height: 220px;
		overflow-y: auto;
	}
	#askmenu .mi {
		display: flex;
		gap: .6rem;
		align-items: baseline;
		padding: .3rem .45rem;
		border-radius: 7px;
		cursor: pointer;
	}
	#askmenu .mi code { color: var(--accent); font-size: .8rem; white-space: nowrap; }
	#askmenu .mi span {
		color: var(--muted);
		font-size: .78rem;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	#askmenu .mi.on, #askmenu .mi:hover { background: var(--say-bg); }
	.qa {
		position: relative;
		border: 1px solid var(--line);
		border-radius: 8px;
		background: var(--panel);
		padding: .55rem .85rem .6rem;
		margin: .6rem 0 0;
		font-size: .9rem;
		transition: border-color .25s, box-shadow .25s;
	}
	.qa.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--say-bg); }
	.qa-replybox { margin: .55rem 0 0; padding-top: .5rem; border-top: 1px solid var(--line); }
	.qa-replybox input { font-size: .85em; padding: .1rem 0; }
	.qa-quote {
		display: flex;
		gap: .4rem;
		align-items: center;
		border-left: 2px solid var(--accent);
		background: var(--say-bg);
		border-radius: 4px;
		padding: .2rem .45rem;
		margin-bottom: .35rem;
		font-size: .78em;
		color: var(--muted);
	}
	.qa-quote span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.qa-quote button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1em; padding: 0 .1rem; }
	.qa.reply .qa-sel { font-size: .8em; margin: 0 0 .2rem; }
	.qa-flow { display: flex; flex-wrap: wrap; gap: .3rem .4rem; align-items: center; margin: .3rem 0 0; }
	.qa-flow .step {
		background: var(--code-bg);
		border: 1px solid var(--line);
		border-radius: 6px;
		padding: .1rem .45rem;
		font-size: .82em;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	}
	.qa-flow .arw { color: var(--accent); font-weight: 600; }
	.qa-svg { margin: .35rem 0 0; }
	.qa-svg svg { max-width: 100%; height: auto; display: block; }
	.qa-a pre { margin: .35rem 0 .15rem; padding: .5rem .65rem; }
	.qa-a pre code { font-size: .76rem; white-space: pre-wrap; overflow-wrap: anywhere; }
	.qa-a .jk { color: var(--accent); }
	#discuss { margin-top: 3.5rem; }
	#discuss h2 kbd {
		font-family: inherit;
		font-size: .7rem;
		border: 1px solid var(--line);
		border-radius: 5px;
		padding: .05rem .35rem;
		color: var(--muted);
	}
	#discuss-box {
		border: 1px solid var(--line);
		border-radius: 10px;
		background: var(--panel);
		box-shadow: var(--shadow);
		padding: .45rem .6rem;
		margin-top: .8rem;
	}
	#discuss-box input { font-size: .92rem; padding: .15rem .1rem; }
	#chatlog { display: flex; flex-direction: column; gap: .6rem; margin-top: .9rem; }
	#chatlog:empty { display: none; margin: 0; }
	#chatlog .qa { margin: 0; }
	/* One input for the discussion: card reply boxes hide here, the main box below serves all. */
	#chatlog .qa-replybox { display: none; }
	/* Corner hook pointing at the corner that faces the asked text. */
	/* The corner hook points at the asked text, so it is also the handle for it:
	   hovering the hook lights that mark and its thread harder than the card does. */
	.qa .hook {
		position: absolute; width: 34px; height: 34px; display: none; cursor: pointer;
		border-radius: 50%; opacity: .7;
		background: radial-gradient(circle at center, var(--hook-core) 0%, var(--hook-mid) 42%, transparent 70%);
		transition: opacity .2s, transform .2s;
	}
	.qa .hook::before { content: ""; position: absolute; inset: -8px; }
	.qa.dir-tr .hook { display: block; top: -13px; right: -13px; }
	.qa.dir-tl .hook { display: block; top: -13px; left: -13px; }
	.qa.dir-br .hook { display: block; bottom: -13px; right: -13px; }
	.qa.dir-bl .hook { display: block; bottom: -13px; left: -13px; }
	.qa .hook:hover { opacity: 1; transform: scale(1.18); }
	#hl-layer .hl.asked.strong { background: var(--hl-strong); }
	#link-layer path.strong { opacity: .9; stroke-width: 2; }
	.qa::before { content: "ASKED"; color: var(--accent); }
	.qa-sel {
		color: var(--muted);
		border-left: 2px solid var(--line);
		padding-left: .5rem;
		margin: 0 0 .25rem;
		font-size: .82rem;
		overflow-wrap: anywhere;
	}
	.qa-sel.was { opacity: .62; text-decoration: line-through; text-decoration-color: var(--line); }
	.qa-sel.now b { color: var(--muted); font-weight: 600; }
	.qa-q { font-weight: 600; margin: 0; }
	.qa-a { margin: .3rem 0 0; overflow-wrap: anywhere; }
	.qa-a code { overflow-wrap: anywhere; }
	.qa a { color: var(--accent); text-decoration: none; }
	.qa a:hover { text-decoration: underline; text-underline-offset: 2px; }
	.qa-a p { margin: .15rem 0 0; }
	.qa-status, .qa-note { color: var(--muted); font-size: .78rem; margin: .3rem 0 0; }
	.qa-note::before { content: "✦ "; color: var(--accent); }
	#qa-rail .qa { margin: 0; font-size: .84rem; box-shadow: var(--shadow); border-radius: 8px; }
	.qa.reply, #qa-rail .qa.reply {
		position: static;
		margin: .6rem 0 0;
		padding: .55rem 0 0;
		border: 0;
		border-top: 1px solid var(--line);
		border-radius: 0;
		background: transparent;
		box-shadow: none;
		font-size: 1em;
	}
	.qa.reply::before, .qa.reply::after { content: none; }
	.qa.reply .qa-q::before { content: "\21B3\00a0"; color: var(--accent); font-weight: 700; }
	/* A thread from a mark to its card. Drawn behind the text at low opacity,
	   so it reads as a hint rather than a line you have to look past. */
	#link-layer, #link-layer-over { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
	#link-layer { z-index: -1; }
	/* a mark inside a block sits on an opaque panel, so its thread rides above it */
	#link-layer-over { z-index: 4; }
	#link-layer path, #link-layer-over path { fill: none; stroke: var(--accent); transition: opacity .25s, stroke-width .25s; }
	#link-layer .halo, #link-layer-over .halo { stroke-width: 7; opacity: .07; filter: url(#thread-blur); pointer-events: none; }
	#link-layer .core, #link-layer-over .core { stroke-width: 1; opacity: .16; pointer-events: stroke; }
	#link-layer g:hover .halo, #link-layer-over g:hover .halo, .halo.lit { opacity: .18; stroke-width: 9; }
	#link-layer g:hover .core, #link-layer-over g:hover .core, .core.lit { opacity: .45; stroke-width: 1.3; }
	.halo.strong { opacity: .3; stroke-width: 11; }
	.core.strong { opacity: .8; stroke-width: 1.6; }
	#hl-layer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
	#hl-layer .hl { position: absolute; border-radius: 2px; }
	#hl-layer .hl.asking { background: var(--hl-asking); }
	#hl-layer .hl.asked { background: var(--hl-asked); transition: background .15s; }
	#hl-layer .hl.asked.lit { background: var(--hl-lit); }
</style>
{{LOOK}}
</head>
<body>
{{NAV}}
<main>

<h1>{{TITLE}}</h1>
<p class="sub">{{SUBTITLE}}</p>

{{BODY}}

</main>
<script id="skills-data" type="application/json">{{SKILLS}}</script>
<script>
	const links = [...document.querySelectorAll('#toc a')];
	const targets = links.map(a => document.getElementById(a.hash.slice(1))).filter(Boolean);
	const spy = new IntersectionObserver(entries => {
		entries.forEach(e => {
			if (!e.isIntersecting) return;
			links.forEach(a => a.classList.toggle('active', a.hash === '#' + e.target.id));
		});
	}, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
	targets.forEach(t => spy.observe(t));

	// Ask-from-selection: POST to serve.py, poll /qa.json, pin cards under stops.
	const mainEl = document.querySelector('main');
	const chip = document.createElement('div');
	chip.id = 'askchip';
	const askBtn = document.createElement('button');
	askBtn.type = 'button';
	askBtn.textContent = 'Ask';
	const quoteBtn = document.createElement('button');
	quoteBtn.type = 'button';
	quoteBtn.textContent = 'Quote';
	chip.append(askBtn, quoteBtn);
	const pop = document.createElement('div');
	pop.id = 'askpop';
	const askInput = document.createElement('input');
	askInput.placeholder = 'ask about this selection… ("/" for skills)';
	const menu = document.createElement('div');
	menu.id = 'askmenu';
	pop.append(askInput, menu);
	document.body.append(chip, pop);

	let skills = [];
	try { skills = JSON.parse(document.getElementById('skills-data').textContent); } catch (e) {}
	if (!Array.isArray(skills)) skills = [];
	let menuHits = [];
	let menuIdx = 0;

	function closeMenu() { menu.style.display = 'none'; menuHits = []; }
	function updateMenu() {
		const m = askInput.value.match(/^\/(\S*)$/);
		if (!m || !skills.length) { closeMenu(); return; }
		const tok = m[1].toLowerCase();
		menuHits = skills
			.filter(s => s.name.toLowerCase().includes(tok))
			.sort((a, b) => (b.name.toLowerCase().startsWith(tok)) - (a.name.toLowerCase().startsWith(tok)) || a.name.localeCompare(b.name))
			.slice(0, 8);
		if (!menuHits.length) { closeMenu(); return; }
		menuIdx = Math.min(menuIdx, menuHits.length - 1);
		menu.replaceChildren(...menuHits.map((s, i) => {
			const item = document.createElement('div');
			item.className = 'mi' + (i === menuIdx ? ' on' : '');
			const name = document.createElement('code');
			name.textContent = '/' + s.name;
			const hint = document.createElement('span');
			hint.textContent = s.hint || '';
			item.append(name, hint);
			item.addEventListener('pointerdown', e => { e.preventDefault(); menuIdx = i; pickSkill(); });
			return item;
		}));
		menu.style.display = 'block';
		const on = menu.children[menuIdx];
		if (on) on.scrollIntoView({ block: 'nearest' });
	}
	function pickSkill() {
		const hit = menuHits[menuIdx];
		if (!hit) return;
		askInput.value = '/' + hit.name + ' ';
		closeMenu();
		askInput.focus();
	}
	askInput.addEventListener('input', () => { menuIdx = 0; updateMenu(); });

	let sel = null;
	const pendingSince = {};
	const claimWaiters = {};
	const renderedClaims = {};
	let pollTimer = null;

	// Keep the selection painted while the input has focus, flip it yellow once sent.
	// Overlay rectangles merged per line, so the band is continuous like a native
	// selection even across code spans with different font metrics.
	const hlLayer = document.createElement('div');
	hlLayer.id = 'hl-layer';
	const rail = document.createElement('div');
	rail.id = 'qa-rail';
	const DEFS = '<defs><filter id="thread-blur" x="-20%" y="-20%" width="140%" height="140%">'
		+ '<feGaussianBlur stdDeviation="2.6"/></filter></defs>';
	const linkLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
	linkLayer.id = 'link-layer';
	linkLayer.innerHTML = DEFS;
	const linkOver = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
	linkOver.id = 'link-layer-over';
	linkOver.innerHTML = DEFS;
	const linkLayers = [linkLayer, linkOver];
	const eachThread = (sel, fn) => linkLayers.forEach(l => l.querySelectorAll(sel).forEach(fn));
	// Discussion: a comments section at the end of the page, not a floating box.
	// A rendered page already carries one, so adopt it; only build it when absent.
	let discuss = document.getElementById('discuss');
	let chatlog, discussBox, chatInput;
	if (discuss) {
		chatlog = discuss.querySelector('#chatlog');
		discussBox = discuss.querySelector('#discuss-box');
		chatInput = discussBox.querySelector('input');
	} else {
		discuss = document.createElement('section');
		discuss.id = 'discuss';
		const discussH = document.createElement('h2');
		discussH.innerHTML = 'Discussion <span class="hint"><kbd>⌘K</kbd> jumps here, with a selection it quotes it</span>';
		chatlog = document.createElement('div');
		chatlog.id = 'chatlog';
		discussBox = document.createElement('div');
		discussBox.id = 'discuss-box';
		chatInput = document.createElement('input');
		chatInput.placeholder = 'ask, or tell me to change the page…';
		discussBox.append(chatInput);
		discuss.append(discussH, chatlog, discussBox);
		mainEl.append(discuss);
	}
	document.body.append(linkLayer, hlLayer, rail, linkOver);

	function goDiscuss() {
		chatInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
		chatInput.focus({ preventScroll: true });
	}
	document.addEventListener('keydown', e => {
		if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
			e.preventDefault();
			const info = readSelection();
			if (info) startSpotQuote(info.text, info.range, info.stop, info.block, info.part);
			else goDiscuss();
		} else if (e.key === 'Escape') hideAsk();
	});
	chatInput.addEventListener('keydown', e => {
		if (e.key === 'Escape') { e.stopPropagation(); discussQuote.clear(); return; }
		if (e.key !== 'Enter') return;
		const question = chatInput.value.trim();
		if (!question) return;
		chatInput.value = '';
		const quote = discussQuote.take();
		sendQuestion({ question, quote, stop: quote ? quote.stop || '' : '', via: 'spot',
			block: quote ? quote.block || '' : '', part: quote ? quote.part || '' : '' });
	});
	let savedRange = null;
	let askingRange = null;
	const askedRanges = new Map();

	function lineBands(range) {
		const lines = [];
		for (const r of range.getClientRects()) {
			if (r.width <= 0 || r.height <= 0) continue;
			const line = lines.find(l =>
				Math.min(l.bottom, r.bottom) - Math.max(l.top, r.top) > Math.min(l.bottom - l.top, r.height) * .5);
			if (!line) { lines.push({ top: r.top, bottom: r.bottom, left: r.left, right: r.right }); continue; }
			line.top = Math.min(line.top, r.top);
			line.bottom = Math.max(line.bottom, r.bottom);
			line.left = Math.min(line.left, r.left);
			line.right = Math.max(line.right, r.right);
		}
		return lines;
	}
	// Two marks share one identity: the band over the words and the thread to the card.
	function markQid(id, cls, on) {
		hlLayer.querySelectorAll('.hl[data-qid="' + id + '"]').forEach(d => d.classList.toggle(cls, on));
		eachThread('path[data-qid="' + id + '"]', d => d.classList.toggle(cls, on));
	}
	// Bands first, then card geometry, then the threads that connect the two.
	function repaintAll() { paintHl(); layoutRail(); paintLinks(); }
	function paintHl() {
		// Collect every band before touching the DOM: one layout write, no thrash.
		const frag = document.createDocumentFragment();
		const draw = (range, cls, qid) => {
			for (const line of lineBands(range)) {
				const d = document.createElement('div');
				d.className = 'hl ' + cls;
				if (qid) d.dataset.qid = qid;
				d.style.left = line.left + scrollX + 'px';
				d.style.top = line.top + scrollY + 'px';
				d.style.width = (line.right - line.left) + 'px';
				d.style.height = (line.bottom - line.top) + 'px';
				frag.append(d);
			}
		};
		askedRanges.forEach((r, id) => draw(r, 'asked', id));
		if (askingRange) draw(askingRange, 'asking');
		hlLayer.replaceChildren(frag);
	}
	// Click a yellow mark, its card scrolls in and flashes. Hit-tested from the
	// document so the overlay never steals text selection.
	function focusCard(id) {
		const card = document.getElementById('qa-' + id);
		if (!card) return;
		const r = card.getBoundingClientRect();
		if (r.top < 0 || r.bottom > innerHeight) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
		card.classList.add('focus');
		setTimeout(() => card.classList.remove('focus'), 1600);
	}
	document.addEventListener('click', e => {
		const s = getSelection();
		if (s && !s.isCollapsed) return;
		if (e.target.closest('.qa, #askchip, #askpop, a')) return;
		for (const d of hlLayer.querySelectorAll('.hl.asked')) {
			const r = d.getBoundingClientRect();
			if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
				focusCard(d.dataset.qid);
				return;
			}
		}
	});
	// Cards float beside their highlight, Docs-comment style, on whichever
	// margin has room, left, right, or both; in-flow when neither does.
	function sideRooms() {
		const m = mainEl.getBoundingClientRect();
		const toc = document.getElementById('toc');
		const tocEdge = toc && getComputedStyle(toc).display !== 'none' ? toc.getBoundingClientRect().right : 0;
		const leftRoom = Math.min(320, m.left - tocEdge - 44);
		const rightRoom = Math.min(320, innerWidth - m.right - 40);
		return {
			left: leftRoom >= 240 ? { x: m.left - 24 - leftRoom, width: leftRoom } : null,
			right: rightRoom >= 240 ? { x: m.right + 24, width: rightRoom } : null,
		};
	}
	function setDir(card, dir) {
		card.classList.remove('dir-tl', 'dir-tr', 'dir-bl', 'dir-br');
		if (!dir) return;
		card.classList.add('dir-' + dir);
		if (!card.querySelector(':scope > .hook')) {
			const hook = document.createElement('span');
			hook.className = 'hook';
			const id = card.id.slice(3);
			hook.addEventListener('mouseenter', () => markQid(id, 'strong', true));
			hook.addEventListener('mouseleave', () => markQid(id, 'strong', false));
			hook.addEventListener('click', () => {
				const band = hlLayer.querySelector('.hl[data-qid="' + id + '"]');
				if (band) scrollTo({ top: parseFloat(band.style.top) - innerHeight / 2, behavior: 'smooth' });
			});
			card.prepend(hook);
		}
	}
	// One home-resolution for every card: thread under its parent, the discussion
	// log, or anchored beside the text (rail when a margin has room, in-flow otherwise).
	function cardKind(card) {
		if (card.dataset.parent && document.getElementById('qa-' + card.dataset.parent)) return 'thread';
		if (card.dataset.via === 'spot'
			|| (!card.dataset.parent && !card.dataset.stop && !card.querySelector(':scope > .qa-sel'))) return 'chatlog';
		return 'anchored';
	}
	function unpin(card, dir = null) {
		card.style.position = card.style.top = card.style.left = card.style.width = '';
		setDir(card, dir);
	}
	function placeCard(card, rooms) {
		const kind = cardKind(card);
		if (kind === 'chatlog') {
			if (card.parentElement !== chatlog) chatlog.append(card);
			unpin(card);
			return;
		}
		if (kind === 'thread') {
			const parent = document.getElementById('qa-' + card.dataset.parent);
			const box = parent.querySelector(':scope > .qa-replybox');
			if (card.parentElement !== parent || (box && card.nextElementSibling !== box)) {
				parent.insertBefore(card, box || null);
			}
			unpin(card);
			return;
		}
		rooms = rooms || sideRooms();
		if (rooms.left || rooms.right) {
			if (card.parentElement !== rail) rail.append(card);
			return;
		}
		const host = card.dataset.stop && document.getElementById(card.dataset.stop);
		const target = host || mainEl;
		if (card.parentElement !== target) target.append(card);
		unpin(card, 'tl');
	}
	function layoutRail() {
		const rooms = sideRooms();
		const all = [...document.querySelectorAll('.qa')];
		all.forEach(c => placeCard(c, rooms));
		if (!rooms.left && !rooms.right) return;
		const cards = all.filter(c => cardKind(c) === 'anchored');
		const anchored = cards.map(card => {
			const range = askedRanges.get(card.id.slice(3));
			let y = null;
			if (range) { const b = lineBands(range)[0]; if (b) y = b.top + scrollY; }
			if (y == null) {
				const host = card.dataset.stop && document.getElementById(card.dataset.stop);
				y = (host || mainEl).getBoundingClientRect().top + scrollY;
			}
			return { card, y };
		}).sort((a, b) => a.y - b.y);
		const bottoms = { left: -1e9, right: -1e9 };
		for (const { card, y } of anchored) {
			let side = 'right';
			if (rooms.left && rooms.right) {
				side = Math.max(y, bottoms.left + 12) <= Math.max(y, bottoms.right + 12) ? 'left' : 'right';
			} else if (rooms.left) side = 'left';
			const room = rooms[side];
			const top = Math.max(y, bottoms[side] + 12);
			card.style.position = 'absolute';
			card.style.top = top + 'px';
			card.style.left = room.x + scrollX + 'px';
			card.style.width = room.width + 'px';
			bottoms[side] = top + card.offsetHeight;
			const vert = y > top + card.offsetHeight / 2 ? 'b' : 't';
			setDir(card, vert + (side === 'left' ? 'r' : 'l'));
		}
	}
	function paintLinks() {
		const doc = document.documentElement;
		const mainR = mainEl.getBoundingClientRect();
		const frags = new Map();
		for (const layer of linkLayers) {
			layer.setAttribute('width', doc.scrollWidth);
			layer.setAttribute('height', doc.scrollHeight);
			frags.set(layer, document.createDocumentFragment());
		}
		for (const [id, range] of askedRanges) {
			const card = document.getElementById('qa-' + id);
			if (!card || !rail.contains(card)) continue;
			const bands = lineBands(range);
			if (!bands.length) continue;
			const cr = card.getBoundingClientRect();
			const cardLeftOfText = cr.right < bands[0].left;
			const band = bands[bands.length - 1];
			const hook = card.querySelector(':scope > .hook');
			const hookVisible = hook && getComputedStyle(hook).display !== 'none';
			const from = cardLeftOfText
				? { x: band.left + scrollX, y: (band.top + band.bottom) / 2 + scrollY }
				: { x: band.right + scrollX, y: (band.top + band.bottom) / 2 + scrollY };
			// land in the middle of the glow, not on the card's edge beside it
			const hr = hookVisible ? hook.getBoundingClientRect() : null;
			const to = hr
				? { x: hr.left + hr.width / 2 + scrollX, y: hr.top + hr.height / 2 + scrollY }
				: { x: (cardLeftOfText ? cr.right : cr.left) + scrollX, y: cr.top + scrollY + Math.min(22, cr.height / 2) };
			const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
			const dy = to.y - from.y;
			const span = Math.abs(to.x - from.x);
			if (Math.abs(dy) < 26) {
				// level: a soft wave, so the thread reads as drawn rather than ruled
				const d1 = Math.max(30, span * 0.36);
				const lift = Math.max(4, Math.min(9, span * 0.05)) * (dy >= 0 ? -1 : 1);
				const sx = cardLeftOfText ? -1 : 1;
				p.setAttribute('d',
					`M ${from.x} ${from.y} C ${from.x + sx * d1} ${from.y + lift}` +
					` ${to.x - sx * d1} ${to.y - lift} ${to.x} ${to.y}`);
			} else {
				// far apart: one smooth sweep whose control points sit in the gutter,
				// so it leaves and arrives horizontally and never corners
				const gutter = cardLeftOfText

	function esc(t) { return t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

			if (t.startsWith('- ')) {

	// Rebuild a Range from the stored selection text, so yellow survives reload.
	const rangeTried = new Set();
	function textMap(root) {
		const rootCard = root.closest ? root.closest('.qa') : null;
		const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
			acceptNode(n) {
				const p = n.parentElement;
				if (rootCard) {
					if (p.closest('.qa') !== rootCard || p.closest('.qa-sel')) return NodeFilter.FILTER_REJECT;
					return NodeFilter.FILTER_ACCEPT;
				}
				return p.closest('.qa, #askpop, #toc, #hl-layer')
					? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
			},
		});
		let hay = '';
		const map = [];
		for (let n; (n = walker.nextNode());) {
			const t = n.nodeValue;
			for (let i = 0; i < t.length; i++) {
				const ws = /\s/.test(t[i]);
				if (ws && (hay === '' || hay.endsWith(' '))) continue;
				hay += ws ? ' ' : t[i];
				map.push({ n, i });
			}
		}
		return { hay, map };

	function findRange(root, needle, cache) {
		const norm = needle.replace(/\s+/g, ' ').trim();
		if (!norm) return null;
		let tm = cache && cache.get(root);
		if (!tm) {
			tm = textMap(root);
			if (cache) cache.set(root, tm);
		}
		const at = tm.hay.indexOf(norm);
		if (at < 0) return null;
		const s = tm.map[at];
		const e = tm.map[at + norm.length - 1];
		const range = document.createRange();
		range.setStart(s.n, s.i);
		range.setEnd(e.n, e.i + 1);

	function restoreRanges(questions, rebinds) {

			if (askedRanges.has(q.id) || rangeTried.has(q.id) || !wants.length) continue;
			rangeTried.add(q.id);

			const root = parent || (q.stop && document.getElementById(q.stop)) || mainEl;
			let range = null;

	async function syncQA() {

			for (const q of d.questions) {
				changed = upsertCard(q, answers[q.id], rebinds[q.id]) || changed;
				if (answers[q.id] === undefined) pending = true;

			if (pending) startPolling(); else stopPolling();

				steps.forEach((s, i) => setTimeout(() => {

				run.textContent = 'flowing…';
				val.textContent = c.seed || '';
				hops.forEach(n => n.classList.remove('hot'));
				c.hops.forEach((_, i) => setTimeout(() => {
					show(i);
					if (i === c.hops.length - 1) { run.disabled = false; run.textContent = label; }
				}, 700 * (i + 1)));
			});
		},
		dial(el, c) {
			const rng = el.querySelector('.rng'), dv = el.querySelector('.dv');
			const read = el.querySelector('.read'), verdict = el.querySelector('.verdict');
			const draw = () => {
				const v = parseFloat(rng.value);
				dv.textContent = c.decimals != null ? v.toFixed(c.decimals) : v;
				const zone = (c.zones || []).find(z => v <= z.upto) || (c.zones || [])[c.zones.length - 1];
				if (zone) {
					verdict.textContent = zone.verdict || '';
					verdict.className = 'verdict tone-' + (zone.tone || 'good');
				}
				if (c.readout) read.innerHTML = c.readout.replace(/\{v\}/g, dv.textContent);
			};
			rng.addEventListener('input', draw);
			draw();
		},
		probe(el, c) {
			const route = el.querySelector('.route'), fields = el.querySelector('.fields');
			el.querySelectorAll('.in').forEach(b => b.addEventListener('click', () => {
				el.querySelectorAll('.in').forEach(x => x.classList.toggle('on', x === b));
				const inp = c.inputs[+b.dataset.i];
				route.innerHTML = 'route: <b class="tone-' + (inp.tone || 'good') + '">' + inp.route + '</b>';
				fields.textContent = Object.entries(inp.fields || {})
					.map(([k, v]) => k + ': ' + (v === '' ? '(empty)' : v)).join(' · ');
			}));
		},
		bind(el) {
			const glow = (k, on) => el.querySelectorAll('[data-k="' + k + '"]')
				.forEach(x => x.classList.toggle('glow', on));
			el.querySelectorAll('.bd, .bl').forEach(x => {
				x.addEventListener('mouseenter', () => glow(x.dataset.k, true));
				x.addEventListener('mouseleave', () => glow(x.dataset.k, false));
			});
		},
		ledger(el, c) {
			const row = el.querySelector('.row'), n = el.querySelector('.n'), log = el.querySelector('.log');
			const empty = row.textContent;
			let state = null;
			const say = (t, tone) => {
				log.innerHTML = '<div class="' + (tone ? 'tone-' + tone : '') + '">' + t + '</div>' + log.innerHTML;
				while (log.children.length > 3) log.lastChild.remove();
			};
			el.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => {
				const a = c.actions[+b.dataset.i];
				if (a.needsRow && !state) { say(a.refuses || 'nothing to act on yet'); return; }
				if (a.creates) state = state ? { ...state, ...(a.sets || {}) } : { ...(a.creates || {}) };
				else if (state && a.sets) state = { ...state, ...a.sets };
				say(state && a.repeat && b.dataset.fired ? (a.repeat) : (a.says || ''), a.tone);
				b.dataset.fired = '1';
				row.textContent = state ? JSON.stringify(state) : empty;
				n.textContent = state ? '1' : '0';
				row.style.background = 'var(--say-bg)';
				setTimeout(() => { row.style.background = ''; }, 450);
			}));
		},
		stepper(el, c) {
			const body = el.querySelector('.moment'), ref = el.querySelector('.ref'), dots = el.querySelector('.dots');
			let i = 0;
			const draw = () => {
				const m = c.moments[i];
				body.innerHTML = m.text || '';
				ref.innerHTML = m.chip || '';
				dots.textContent = c.moments.map((_, j) => j === i ? '●' : '○').join('');
			};
			el.querySelector('.next').addEventListener('click', () => { i = (i + 1) % c.moments.length; draw(); });
			el.querySelector('.prev').addEventListener('click', () => { i = (i + c.moments.length - 1) % c.moments.length; draw(); });
			draw();
		},
		map() { /* nodes are plain links, nothing to wire */ },
		space(el, c) {
			const star = el.querySelector('.star'), read = el.querySelector('.read');
			const pts = [...el.querySelectorAll('.pt')];
			el.querySelectorAll('.q').forEach(b => b.addEventListener('click', () => {
				el.querySelectorAll('.q').forEach(x => x.classList.toggle('on', x === b));
				const q = c.queries[+b.dataset.i];
				star.setAttribute('x', q.star[0]); star.setAttribute('y', q.star[1]);
				const scored = pts.map((p, i) => ({ p, i, s: (q.scores || [])[i] || 0 })).sort((a, b2) => b2.s - a.s);
				const near = scored.slice(0, q.top || 3);
				pts.forEach(p => p.classList.remove('near'));
				near.forEach(x => x.p.classList.add('near'));
				read.innerHTML = 'nearest for <b>' + q.label + '</b>: ' + near
					.map(x => c.points[x.i].label + ' <code>' + x.s.toFixed(2) + '</code>').join(' · ');
			}));
		},
		angle(el, c) {
			const rng = el.querySelector('.rng'), cv = el.querySelector('.cv');
			const OX = 30, OY = 120, R = 100;
			const pt = (d, r) => [OX + r * Math.cos(d * Math.PI / 180), OY - r * Math.sin(d * Math.PI / 180)];
			const gate = c.gate != null ? c.gate : 0.35;
			const gd = Math.acos(gate) * 180 / Math.PI, [gx, gy] = pt(gd, R);
			el.querySelector('.gate').setAttribute('x2', gx);
			el.querySelector('.gate').setAttribute('y2', gy);
			const pv = el.querySelector('.pv'), pl = el.querySelector('.plab');
			const arc = el.querySelector('.arc'), dl = el.querySelector('.deg'), zone = el.querySelector('.zone');
			const gl = el.querySelector('.gatelab'), [lx, ly] = pt(gd, R + 4);
			gl.setAttribute('x', lx - 12); gl.setAttribute('y', ly - 4);
			gl.textContent = gate.toFixed(2) + ' gate';
			const draw = () => {
				const d = +rng.value, [vx, vy] = pt(d, R);
				pv.setAttribute('x2', vx); pv.setAttribute('y2', vy);
				const [px, py] = pt(d, R + 12);
				pl.setAttribute('x', px - 10); pl.setAttribute('y', py); pl.textContent = 'page';
				const [ax, ay] = pt(0, 34), [bx, by] = pt(d, 34);
				arc.setAttribute('d',
					'M ' + OX + ' ' + OY + ' L ' + ax + ' ' + ay + ' A 34 34 0 0 0 ' + bx + ' ' + by + ' Z');
				const [dx, dy] = pt(d / 2, 48);
				dl.setAttribute('x', dx - 8); dl.setAttribute('y', dy + 3); dl.textContent = d + '°';
				const cos = Math.cos(d * Math.PI / 180);
				cv.textContent = cos.toFixed(2);
				const z = (c.zones || []).find(z2 => cos > z2.above) || { text: 'pointing away, opposite meaning', tone: 'bad' };
				zone.textContent = z.text; zone.className = 'zone tone-' + (z.tone || 'good');
			};
			rng.addEventListener('input', draw);
			draw();
		},
		stack(el, c) {
			const bar = el.querySelector('.fill'), tok = el.querySelector('.tok'), verdict = el.querySelector('.verdict');
			const draw = () => {
				let t = 0;
				el.querySelectorAll('.pt input').forEach(x => { if (x.checked) t += c.parts[+x.dataset.i].tokens; });
				tok.textContent = t.toLocaleString('de-CH').replace(/,/g, "'");
				const over = t > c.budget;
				bar.style.width = Math.min(100, t / c.budget * 100) + '%';
				bar.style.background = over ? 'var(--ba-bad-fg)' : 'var(--accent)';
				verdict.textContent = over ? (c.over || 'over budget, the model truncates') : (c.fits || 'fits');
				verdict.className = 'verdict tone-' + (over ? 'bad' : 'good');
			};
			el.querySelectorAll('.pt input').forEach(x => x.addEventListener('change', draw));
			draw();
		},
		raw() {},
	};
	document.querySelectorAll('.blk[data-block]').forEach(el => {
		const kind = el.dataset.block, fn = BLOCK[kind];
		if (!fn) return;
		const cfgEl = el.querySelector(':scope > .blk-cfg');
		let cfg = {};
		try { cfg = JSON.parse(cfgEl ? cfgEl.textContent : '{}'); } catch (e) {}
		try { fn(el, cfg); } catch (e) { console.error('block ' + kind, e); }
	});

	// Claim checks: the button asks the session to generate them, the answer's
	// bullets become tickable rows. Generated at the end, never at build time.
	const genBtn = document.getElementById('gen-claims');
	if (genBtn) {
		const clBody = document.getElementById('cl-body'), clScore = document.getElementById('cl-score');
		const rescore = () => {
			const rows = [...clBody.querySelectorAll('.cl')];
			clScore.textContent = rows.length
				? rows.filter(r => r.classList.contains('done')).length + ' of ' + rows.length + ' confirmed' : '';
		};
		const wire = () => {
			clBody.querySelectorAll('.cl .tick').forEach(t => t.addEventListener('click', () => {
				t.closest('.cl').classList.toggle('done');
				rescore();
			}));
			rescore();
		};
		wire();
		genBtn.addEventListener('click', () => {
			genBtn.disabled = true;
			genBtn.textContent = 'generating…';
			const id = newId();
			claimWaiters[id] = () => { genBtn.disabled = false; };
			submitQuestion({
				id, stop: '', selection: '', parent: '', via: 'ledger',
				question: 'generate the claim checks for this page, one claim per bullet, each with its file:line chip',
			});
		});
		window.__renderClaims = (answer) => {
			const rows = answer.split('\n').map(l => l.trim()).filter(l => l.startsWith('- '));
			if (!rows.length) return;
			clBody.innerHTML = rows.map(l =>
				'<div class="cl"><span class="tick"></span><span class="txt">' + inline(esc(l.slice(2))) + '</span></div>'
			).join('');
			document.getElementById('claims-blk').classList.remove('empty');
			genBtn.classList.remove('primary');
			genBtn.textContent = 'regenerate';
			wire();
		};
	}

	function startPolling() { if (!pollTimer) pollTimer = setInterval(syncQA, 2000); }
	function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
	syncQA();
</script>
